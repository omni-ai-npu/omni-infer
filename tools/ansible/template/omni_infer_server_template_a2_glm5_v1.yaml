- name: run omniai
  hosts: all
  any_errors_fatal: true
  max_fail_percentage: 0
  gather_facts: yes

  vars:
    # Static global config
    LOG_PATH: "/data/log_path"
    MODEL_PATH: "/your/path/models/GLM-5.2-w8a8c16"
    MODEL_LEN_MAX_PREFILL: 128000
    MODEL_LEN_MAX_DECODE: 128000
    MAX_NUM_SEQ_PREFILL: 32
    MAX_NUM_SEQ_DECODE: 4

    LOG_PATH_IN_EXECUTOR: "/your/path/log_path"
    CODE_PATH: "/your/path/ds32"
    KV_CONNECTOR: "LLMDataDistConnector"

    # Configuration for containers
    DOCKER_IMAGE_ID: "REPOSITORY:TAG"
    DOCKER_NAME_P: "your_name_omni_infer_prefill"
    DOCKER_NAME_D: "your_name_omni_infer_decode"
    DOCKER_NAME_C: "your_name_omni_infer_proxy"
    SCRIPTS_PATH: "/tmp/scripts_path"

    # Configuration for lb_sdk in global proxy
    PREFILL_LB_SDK: "pd_score_balance"
    DECODE_LB_SDK: "pd_score_balance"
    USE_OMNI_PROXY: "1"

    # Parallel Size
    PREFILL_PP_SIZE: 2
    DECODE_TENSOR_PARALLEL_SIZE: 1

    # MTP configuration
    enable_mtp: true
    num_speculative_tokens: 1
    graph_size: "{{ MAX_NUM_SEQ_DECODE * (1 + num_speculative_tokens) if enable_mtp else MAX_NUM_SEQ_DECODE }}"

    docker_run_cmd: |
      docker run -it --shm-size=500g \
        -e PYTHONHASHSEED=123 \
        -e LANG=C.UTF-8 \
        --net=host \
        --privileged=true \
        -u root \
        -w /data \
        --device=/dev/davinci_manager \
        --device=/dev/hisi_hdc \
        --device=/dev/devmm_svm \
        --entrypoint=bash \
        -v /data:/data \
        -v /mnt:/mnt \
        -v /tmp:/tmp \
        -v {{ MODEL_PATH }}:{{ MODEL_PATH }} \
        -v {{ SCRIPTS_PATH }}:{{ SCRIPTS_PATH }} \
        -v {{ LOG_PATH }}:{{ LOG_PATH }} \
        -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -v /usr/local/sbin:/usr/local/sbin \
        -v /etc/hccn.conf:/etc/hccn.conf \
        -v /usr/bin/hccn_tool:/usr/bin/hccn_tool \
        -v /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime \

    docker_exec_cmd: |
      docker exec \

    run_vllm_server_prefill_cmd: |
      #!/bin/bash
      source ~/.bashrc

      IP_ADDRESSES=$(hostname -I | tr ' ' '\n' | grep -v '^127\.0\.0\.1$' | grep -v '172*' | grep -v '192.168*')
      CLUSTER_IP=$(echo "$IP_ADDRESSES" | head -1)
      IFNAME=$(ip -o -4 addr show 2>/dev/null | awk -v ip="${CLUSTER_IP}" '$4 ~ "^" ip "/" {print $2; exit}')
      if [ -z "$IFNAME" ]; then
        echo "WARN: 无法从 IP ${CLUSTER_IP} 解析网卡，回退 enp23s0f3" >&2
        IFNAME=enp23s0f3
      fi

      # ===== profiler =====
      # prof_dir=/path/to/prof/
      # export VLLM_TORCH_PROFILER_RECORD_SHAPES=true
      # export VLLM_TORCH_PROFILER_WITH_STACK=0
      # export VLLM_TORCH_PROFILER_DIR=$prof_dir
      # export ENABLE_PREFILL_PROFILER=TRUE
      # export PROFILER_TOKEN_THRESHOLD=99999
      # export PROFILER_STOP_STEP=1
      # rm -rf $prof_dir/*

      # ===== network / communication =====
      export RAY_DEDUP_LOGS=0
      export RAY_EXPERIMENTAL_NOSET_ASCEND_RT_VISIBLE_DEVICES=1
      export GLOO_SOCKET_IFNAME="$IFNAME"
      export TP_SOCKET_IFNAME="$IFNAME"
      export HCCL_SOCKET_IFNAME="$IFNAME"
      export VLLM_WORKER_MULTIPROC_METHOD=fork
      export HCCL_OP_EXPANSION_MODE=AIV
      export HCCL_BUFFSIZE=20
      export HCCL_INTRA_ROCE_ENABLE=1
      export HCCL_INTRA_PCIE_ENABLE=0
      export HCCL_ASYNC_ERROR_HANDLING=0
      export HCCL_CONNECT_TIMEOUT=120
      export HCCL_EXEC_TIMEOUT=120
      export VLLM_LOGGING_LEVEL="INFO"

      # ===== model / patches =====
      export OMNI_NPU_PATCHES_DIR=deepseek
      export OMNI_NPU_VLLM_PATCHES=ALL
      export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"

      # ===== role / pod =====
      export ROLE="prefill"
      export PREFILL_POD_NUM={{ groups['P'] | map('extract', hostvars) | map(attribute='host_ip') | unique | length }}
      export DECODE_POD_NUM={{ groups['D'] | map('extract', hostvars) | map(attribute='host_ip') | unique | length }}
      

      # ===== cluster topology (from inventory) =====
      MASTER_IP="{{ hostvars[groups['P'][0]]['ansible_host'] }}"
      NUM_GPUS={{ ascend_rt_visible_devices.split(',') | length }}
      export NUM_DIE_PER_MACH=$NUM_GPUS

      NNODES={{ groups['P'] | map('extract', hostvars) | selectattr('host_ip', '==', host_ip) | length }}
      export NNODES

      # ===== Ray cluster setup (all P nodes) =====
      echo "----------------------------------------"
      echo "  Hostname : {{ inventory_hostname }}"
      echo "  IP       : {{ ansible_host }}"
      echo "  Total    : $NNODES nodes"
      echo "----------------------------------------"
      ray stop --force
      {% if inventory_hostname == groups['P'][0] %}
      ray start --head --num-gpus=$NUM_GPUS
      {% else %}
      sleep 5
      while ! ray start --address="${MASTER_IP}:6379" --num-gpus=$NUM_GPUS &>/dev/null; do
          echo "连接 Ray head 失败，5s 后重试..."
          sleep 5
      done
      echo "已连接 Ray head"
      {% endif %}

      {% if inventory_hostname == 'p0' %}
      # ===== vllm serve (only p0) =====
      PP_SIZE={{ PREFILL_PP_SIZE }}
      TP_SIZE=$((NNODES * NUM_GPUS / PP_SIZE))

      # Ensure log directory exists   
      log_dir="{{ LOG_PATH }}/{{ inventory_hostname }}"
      mkdir -p "$log_dir"

      # 确定性计算，根据需求开启
      # export HCCL_DETERMINISTIC="true"
      # export CLOSE_MATMUL_K_SHIFT="1"

      # PP 分层, GLM-5.2 要在 full 层切换
      export VLLM_PP_LAYER_PARTITION=38,40 

      vllm serve "{{ MODEL_PATH }}" \
          --served-model-name glmmoedsa \
          --host 0.0.0.0 \
          --port {{ api_port }} \
          --dtype auto \
          --max-model-len {{ MODEL_LEN_MAX_PREFILL }} \
          --max-num-batched-tokens 32768 \
          --max-num-seqs {{ MAX_NUM_SEQ_PREFILL }} \
          --long-prefill-token-threshold 32768 \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --distributed-executor-backend ray \
          --gpu-memory-utilization 0.9 \
          --tensor-parallel-size $TP_SIZE \
          --enable-expert-parallel \
          --reasoning-parser glm45 --chat-template {{ MODEL_PATH }}/chat_template.jinja --enable-auto-tool-choice --tool-call-parser glm5 \
          -pp $PP_SIZE \
      {% if enable_mtp %}
          --speculative-config '{"num_speculative_tokens": 1, "method":"deepseek_mtp"}' \
      {% endif %}
          --kv-transfer-config '{"kv_connector":"LLMDataDistConnector", "kv_role":"kv_producer"}' \
          --enforce-eager  > "$log_dir/server.log" 2>&1 &
      {% endif %}
    
    run_vllm_server_decode_cmd: |
      #!/bin/bash
      source ~/.bashrc

      IP_ADDRESSES=$(hostname -I | tr ' ' '\n' | grep -v '^127\.0\.0\.1$' | grep -v '10.244*' | grep -v '172*')

      # 根据本机业务 IPv4 解析网卡名（与 Gloo/TP/HCCL 绑定一致）
      CLUSTER_IP=$(echo "$IP_ADDRESSES" | head -1)
      IFNAME=$(ip -o -4 addr show 2>/dev/null | awk -v ip="${CLUSTER_IP}" '$4 ~ "^" ip "/" {print $2; exit}')
      if [ -z "$IFNAME" ]; then
        echo "WARN: 无法从 IP ${CLUSTER_IP} 解析网卡，回退 enp23s0f3" >&2
        IFNAME=enp23s0f3
      fi

      MASTER_IP="{{ hostvars[groups['D'][0]]['ansible_host'] }}"
      NODE_INDEX={{ groups['D'].index(inventory_hostname) }}

      export HCCL_IF_BASE_PORT=59000
      sysctl -w net.ipv4.ip_local_reserved_ports=59000-59015

      export HCCL_BUFFSIZE=20
      export GLOO_SOCKET_IFNAME=$IFNAME
      export TP_SOCKET_IFNAME=$IFNAME
      export HCCL_SOCKET_IFNAME=$IFNAME
      export ASCEND_RT_VISIBLE_DEVICES={{ ascend_rt_visible_devices }}
      export ASCEND_GLOBAL_LOG_LEVEL=3
      export VLLM_LOGGING_LEVEL="INFO"
      export HCCL_INTRA_ROCE_ENABLE=1
      export HCCL_INTRA_PCIE_ENABLE=0
      
      # export HCCL_ASYNC_ERROR_HANDLING=0
      
      export VLLM_WORKER_MULTIPROC_METHOD="fork"

      # HCCL建链超时
      export HCCL_CONNECT_TIMEOUT=1800
      # export ASCEND_LAUNCH_BLOCKING=1
      
      # 通信算子执行超时
      export HCCL_EXEC_TIMEOUT=1800
      export ROLE="decode"
      export NUM_DIE_PER_MACH=8
      export HCCL_ENTRY_LOG_ENABLE=1

      # 确定性计算，根据需求开启
      # export HCCL_DETERMINISTIC="true"
      # export CLOSE_MATMUL_K_SHIFT="1"

      export HCCL_OP_EXPANSION_MODE="AIV"
      # export TORCH_LOGS="+dynamic"
      # export TORCHDYNAMO_EXTENDED_DEBUG_GUARD_ADDED="Eq(s72, 4)"

      # rm -rf /root/ascend/log/*
      # rm -rf /root/.cache/vllm/torch_compile_cache

      # export VLLM_TORCH_PROFILER_DIR="/data/w00909734/prof"
      # export PROFILER_TOKEN_THRESHOLD=4
      # export PROFILER_STOP_STEP=10

      NNODES={{ groups['D'] | map('extract', hostvars) | map(attribute='ansible_host') | length }}
      NUM_GPUS={{ ascend_rt_visible_devices.split(',') | length }}
      TP_SIZE={{ DECODE_TENSOR_PARALLEL_SIZE }}
      DP_SIZE=$((NNODES * NUM_GPUS / TP_SIZE))

      apiserver_num={{ ascend_rt_visible_devices.split(',') | length }}
      # Using a for loop to start server instances
      for ((i=0; i<apiserver_num; i++)); do
          port=$(({{ api_port }} + i))
          rank=$(( apiserver_num * NODE_INDEX + i ))

          # Ensure log directory exists   
          log_dir="{{ LOG_PATH }}/{{ inventory_hostname }}"
          mkdir -p "$log_dir"

          export OMNI_NPU_PATCHES_DIR=deepseek
          export VLLM_PLUGINS="omni-npu,omni_custom_models,omni_npu_patches"
          export OMNI_NPU_VLLM_PATCHES=ALL

          ASCEND_RT_VISIBLE_DEVICES=$i vllm serve "{{ MODEL_PATH }}" \
              --served-model-name glmmoedsa \
              --host 0.0.0.0 \
              --port $port \
              --dtype auto \
              --max-model-len {{ MODEL_LEN_MAX_DECODE }} \
              --max-num-batched-tokens {{ graph_size }} \
              --no-async-scheduling \
              --max-num-seqs {{ MAX_NUM_SEQ_DECODE }} \
              --no-enable-prefix-caching \
              --distributed-executor-backend mp \
              --gpu-memory-utilization 0.9 \
              --trust-remote-code \
              --tensor-parallel-size $TP_SIZE \
              --data-parallel-size $DP_SIZE \
              --data-parallel-rank $rank \
              --enable-expert-parallel \
              --data-parallel-address $MASTER_IP \
              --data-parallel-rpc-port 13345 \
              --reasoning-parser glm45 --chat-template {{ MODEL_PATH }}/chat_template.jinja --enable-auto-tool-choice --tool-call-parser glm5 \
              --kv-transfer-config '{"kv_connector":"LLMDataDistConnector", "kv_role":"kv_consumer","kv_rank":1, "kv_parallel_size":1}' \
      {% if enable_mtp %}
              --speculative-config '{"num_speculative_tokens": {{ num_speculative_tokens }}, "method":"deepseek_mtp"}' \
      {% endif %}
              --additional_config '{"npugraph_ex_config":{"enable": true}}' \
              --compilation-config '{"level": 3, "cudagraph_mode":"FULL", "cudagraph_capture_sizes":[{{ graph_size }}], "compile_sizes":[{{ graph_size }}]}' \
              > "$log_dir/server_${i}.log" 2>&1 &
      done
    
    run_proxy_cmd: |
      #!/bin/bash
      . ~/.bashrc

      export PYTHONHASHSEED=123

      prefill_result="{{ PREFILL_API_SERVER_LIST }}"
      prefill_result=`echo "$prefill_result" | awk '$1=$1'`

      decode_result=""
      decode_api_servers="{{ DECODE_API_SERVER_LIST }}"
      decode_api_servers=`echo "$decode_api_servers" | awk '$1=$1'`
      decode_array=(${decode_api_servers//,/ })
      for var in ${decode_array[@]}; do
        address=${var%@*}
        ip=${address%:*}
        port=${address#*:}
        num=${var#*@}
        for ((i=0; i<=$num;i++)); do
          if [[ -z ${decode_result} ]]; then
            decode_result="$ip:$port"
          else
            decode_result="${decode_result},$ip:$port"
          fi
          ((port++))
        done
      done

      # Ensure log directory exists   
      log_dir="{{ LOG_PATH }}/{{ inventory_hostname }}"
      mkdir -p $log_dir

      {% if USE_OMNI_PROXY == '1' %}
      bash /workspace/omniinfer/build/build.sh -m "omni-proxy"
      cd /workspace/omniinfer/components/omni-proxy/omni_proxy/
      bash omni_proxy.sh \
        --listen-port {{ node_port }} \
        --prefill-endpoints "$prefill_result" \
        --decode-endpoints "$decode_result" \
        --log-file "$log_dir"/nginx_error.log \
        --log-level notice \
        --access-log-file "$log_dir"/nginx_access.log \
        --core-num 4 \
        --start-core-index 16 \
        --omni-proxy-pd-policy sequential \
        --omni-proxy-model-path {{ MODEL_PATH }} \
        --omni-proxy-max-batch-num-token 100000 \
        --omni-proxy-prefill-max-num-seqs {{ MAX_NUM_SEQ_PREFILL }} \
        --omni-proxy-decode-max-num-seqs {{ MAX_NUM_SEQ_DECODE }}
      {% else %}
      cd /workspace/omniinfer/tools/scripts
      bash global_proxy.sh \
        --listen-port {{ node_port }} \
        --prefill-servers-list "$prefill_result" \
        --decode-servers-list "$decode_result" \
        --log-file "$log_dir"/nginx_error.log \
        --log-level notice \
        --access-log-file "$log_dir"/nginx_access.log \
        --core-num 4 \
        --start-core-index 16 \
        --prefill-lb-sdk {{ PREFILL_LB_SDK }} \
        --decode-lb-sdk {{ DECODE_LB_SDK }} \
        --prefill-max-num-seqs {{ MAX_NUM_SEQ_PREFILL }} \
        --decode-max-num-seqs {{ MAX_NUM_SEQ_DECODE }}
      {% endif %}

    generate_mooncake_config_json: |
      {
        "metadata_server": "etcd://{{ ETCD_IP }}:{{ ETCD_PORT }}",
        "local_hostname": "{{ HOST_IP }}",
        "protocol": "tcp",
        "transfer_timeout": 60,
        "global_segment_size": 17179869184,
        "master_server_address": "{{ MOONCAKE_MASTER_IP }}:{{ MOONCAKE_MASTER_PORT }}"
      }

    generate_lmcache_mooncake_config_yml: |
      # 256 Tokens per kV Chunk
      chunk_size: 256
      # Enable CPU memory backend
      local_cpu: false # default
      # 5GB of Pinned CPU memory
      max_local_cpu_size: 5.0 # default
      
      remote_url: "mooncakestore://{{ MOONCAKE_MASTER_IP }}:{{ MOONCAKE_MASTER_PORT }}"
      remote_serde: "naive"
      external_lookup_client: "mooncakestore://{{ MOONCAKE_MASTER_IP }}:{{ MOONCAKE_MASTER_PORT }}"

      extra_config:
        retmote_enable_mla_worker_id_as0: true

    kill_python_processes_cmd: |
      #!/bin/bash

      ps aux | grep "vllm" | grep -v "grep" | awk '{print $2}' | xargs kill -9
      ps aux | grep "VLLM" | grep -v "grep" | awk '{print $2}' | xargs kill -9
      ps aux | grep "python" | grep -v "grep" | awk '{print $2}' | xargs kill -9


    kill_nginx_processes_cmd: |
      #!/bin/bash

      ps aux | grep "nginx" | grep -v "grep" | awk '{print $2}' | xargs kill -9

    kill_ray_processes_cmd: |
      #!/bin/bash

      ps aux | grep "ray" | grep -v "grep" | awk '{print $2}' | xargs kill -9

    start_docker_cmd_p: >
      {{ docker_run_cmd }}
      -d --name {{ ACTUAL_DOCKER_NAME_P }} {{ DOCKER_IMAGE_ID }}

    start_docker_cmd_d: >
      {{ docker_run_cmd }}
      -d --name {{ ACTUAL_DOCKER_NAME_D }} {{ DOCKER_IMAGE_ID }}

    start_docker_cmd_c: >
      {{ docker_run_cmd }}
      -d --name {{ ACTUAL_DOCKER_NAME_C }} {{ DOCKER_IMAGE_ID }}


    docker_start_vllm_cmd_p: >
      {{ docker_exec_cmd }}
      -e PREFILL_SERVER_LIST=$PREFILL_SERVER_LIST
      -e IP=$IP
      -e HOST_IP=$HOST_IP
      -e API_PORT=$API_PORT
      -e SERVER_IP_LIST=$SERVER_IP_LIST
      -e PREFILL_POD_NUM=$PREFILL_POD_NUM
      -e SOCKET_IFNAME=$SOCKET_IFNAME
      -e KV_RANK=$KV_RANK
      -e NNODES=$NNODES
      -e NODE_RANK=$NODE_RANK
      -e NODE_IP_LIST=$NODE_IP_LIST
      -e KV_CONNECTOR=$KV_CONNECTOR
      -e MOONCAKE_CONFIG_PATH=$MOONCAKE_CONFIG_PATH
      -e LMCACHE_MOONCAKE_CONFIG_PATH=$LMCACHE_MOONCAKE_CONFIG_PATH
      -e USE_OMNI_PROXY=$USE_OMNI_PROXY
      -d {{ ACTUAL_DOCKER_NAME_P }}
      /bin/bash -c {{ SCRIPTS_PATH }}/vllm_run_for_p.sh

    docker_start_vllm_cmd_d: >
      {{ docker_exec_cmd }}
      -e MODEL_PATH=$MODEL_PATH
      -e DECODE_SERVER_LIST=$DECODE_SERVER_LIST
      -e DECODE_DATA_PARALLEL_SIZE=$DECODE_DATA_PARALLEL_SIZE
      -e HOST_IP=$HOST_IP
      -e API_PORT=$API_PORT
      -e SERVER_IP_LIST=$SERVER_IP_LIST
      -e PREFILL_POD_NUM=$PREFILL_POD_NUM
      -e DECODE_POD_NUM=$DECODE_POD_NUM
      -e SOCKET_IFNAME=$SOCKET_IFNAME
      -e NUM_SERVERS=$NUM_SERVERS
      -e HOST=$HOST
      -e KV_CONNECTOR=$KV_CONNECTOR
      -e MOONCAKE_CONFIG_PATH=$MOONCAKE_CONFIG_PATH
      -e LMCACHE_MOONCAKE_CONFIG_PATH=$LMCACHE_MOONCAKE_CONFIG_PATH
      -d {{ ACTUAL_DOCKER_NAME_D }}
      /bin/bash -c {{ SCRIPTS_PATH }}/vllm_run_for_d.sh

    docker_start_proxy_cmd_c: >
      {{ docker_exec_cmd }}
      -e PREFILL_LB_SDK=$PREFILL_LB_SDK
      -e DECODE_LB_SDK=$DECODE_LB_SDK
      -e USE_OMNI_PROXY=$USE_OMNI_PROXY
      -e MODEL_PATH=$MODEL_PATH
      -d {{ ACTUAL_DOCKER_NAME_C }}
      /bin/bash -c {{ SCRIPTS_PATH }}/run_proxy_server.sh > {{ LOG_PATH }}/omni_proxy.log 2>&1

    docker_cp_prefill_code_cmd: "docker cp {{ CODE_PATH }}/omniinfer {{ ACTUAL_DOCKER_NAME_P }}:/workspace/"
    docker_cp_decode_code_cmd: "docker cp {{ CODE_PATH }}/omniinfer {{ ACTUAL_DOCKER_NAME_D }}:/workspace/"
    docker_cp_proxy_code_cmd: "docker cp {{ CODE_PATH }}/omniinfer {{ ACTUAL_DOCKER_NAME_C }}:/workspace/"
    docker_update_proxy_code_cmd: >
      {{ docker_exec_cmd }}
      -e KV_CONNECTOR=$KV_CONNECTOR
      {{ ACTUAL_DOCKER_NAME_C }}
      /bin/bash -c 'source ~/.bashrc && cd /workspace/omniinfer/build && bash build.sh -m "omni-proxy"> ${LOG_PATH}/{{ inventory_hostname }}/install.log;'
    docker_update_prefill_code_cmd: >
      {{ docker_exec_cmd }}
      -e KV_CONNECTOR=$KV_CONNECTOR
      {{ ACTUAL_DOCKER_NAME_P }}
      /bin/bash -c '. ~/.bashrc && cd /workspace/omniinfer/build && git config --global --add safe.directory /workspace/omniinfer && pip uninstall omni_infer -y && bash build.sh -m "omni-npu,omni-cache,omni-eplb"> ${LOG_PATH}/{{ inventory_hostname }}/install.log;'
    # bash build.sh -m "omni-npu,omni-cache,omni-eplb"为编译omni-npu,omni-cache,omni-eplb模块，可根据需要去除不需要的模块，比如bash build.sh -m "omni-npu" 仅编译omni-npu模块
    docker_update_decode_code_cmd: >
      {{ docker_exec_cmd }}
      -e KV_CONNECTOR=$KV_CONNECTOR
      {{ ACTUAL_DOCKER_NAME_D }}
      /bin/bash -c '. ~/.bashrc && cd /workspace/omniinfer/build && git config --global --add safe.directory /workspace/omniinfer && pip uninstall omni_infer -y && bash build.sh -m "omni-npu,omni-cache,omni-eplb"> ${LOG_PATH}/{{ inventory_hostname }}/install.log;'
    docker_start_etcd_cmd: >
      {{ docker_exec_cmd }}
      -e KV_CONNECTOR=$KV_CONNECTOR
      {{ ACTUAL_DOCKER_NAME_C }}
      /bin/bash -c '[ "${KV_CONNECTOR}" != "LMCacheConnectorV1" ] || { nohup etcd --listen-client-urls http://{{ ETCD_IP }}:{{ ETCD_PORT }} --advertise-client-urls http://{{ ETCD_IP }}:{{ ETCD_PORT }} &> ${LOG_PATH}/etcd.log &}'
    docker_start_mooncake_master_cmd: >
      {{ docker_exec_cmd }}
      -e KV_CONNECTOR=$KV_CONNECTOR
      {{ ACTUAL_DOCKER_NAME_C }}
      /bin/bash -c '[ "${KV_CONNECTOR}" != "LMCacheConnectorV1" ] || { source ~/.bashrc && nohup mooncake_master -rpc_address={{ MOONCAKE_MASTER_IP }} -rpc_port={{ MOONCAKE_MASTER_PORT }} -metrics_port={{ MOONCAKE_METRICS_PORT }} -v 2 -eviction_high_watermark_ratio=0.8 -eviction_ratio=0.1 &> ${LOG_PATH}/mooncake_master.log &}'
  tasks:
    - name: generate container name.
      set_fact:
        ACTUAL_DOCKER_NAME_P: "{{ DOCKER_NAME_P }}_{{ inventory_hostname }}"
        ACTUAL_DOCKER_NAME_D: "{{ DOCKER_NAME_D }}_{{ inventory_hostname }}"
        ACTUAL_DOCKER_NAME_C: "{{ DOCKER_NAME_C }}_{{ inventory_hostname }}"
      when: "'P' in group_names or 'D' in group_names or 'C' in group_names"
      tags: always
      
    - name: Check and delete existing Docker containers.
      block:
        - name: Check whether the container exists.
          shell: |
            docker inspect --format='{{"{{.Name}}"}}' \
            {{ [ACTUAL_DOCKER_NAME_P, ACTUAL_DOCKER_NAME_D, ACTUAL_DOCKER_NAME_C] | unique | join(' ') }} \
            2>/dev/null | grep -v '^$'
          register: existing_containers
          failed_when: false
          changed_when: false

        - name: Show generated container name.
          debug:
            msg: "Generated container name: {{ existing_containers.stdout_lines }}"

        - name: Stop containers.
          command: |
            /bin/bash -c "docker stop {{ existing_containers.stdout_lines | join(' ') }}"
          when: existing_containers.stdout != ""

        - name: Delete containers.
          command: |
            /bin/bash -c "docker rm -f {{ existing_containers.stdout_lines | join(' ') }}"
          when: existing_containers.stdout != ""
          failed_when: false
      when: "'P' in group_names or 'D' in group_names or 'C' in group_names"
      tags:
        - run_docker
        - clean_up

    - name: Run container for prefill instances.
      command: bash -c "{{ start_docker_cmd_p }}"
      when: "'P' in group_names"
      tags: run_docker

    - name: Run container for decode instances.
      command: bash -c "{{ start_docker_cmd_d }}"
      when: "'D' in group_names"
      tags: run_docker

    - name: Run container for global proxy server.
      command: bash -c "{{ start_docker_cmd_c }}"
      when: "'C' in group_names"
      tags:
        - run_docker

    - name: Create a directory to store the log.
      ansible.builtin.file:
        path: "{{ LOG_PATH }}/{{ inventory_hostname }}"
        state: directory
      when: "'P' in group_names or 'D' in group_names or 'C' in group_names"
      tags: run_docker

    - name: Create a directory to store the code.
      ansible.builtin.file:
        path: "{{ CODE_PATH }}"
        state: directory
      tags: sync_code

    - name: The executor synchronizes code to all instances.
      synchronize:
        src: "{{ CODE_PATH }}/omniinfer"
        dest: "{{ CODE_PATH }}/"
        delete: yes 
      when: >
        'P' in group_names or
        'D' in group_names or
        (
          'C' in group_names and
          ansible_host not in
          (groups.get('P', []) | map('extract', hostvars, 'ansible_host') | list) and
          ansible_host not in
          (groups.get('D', []) | map('extract', hostvars, 'ansible_host') | list)
        )
      tags: sync_code

    - name: Copy the code from the host machine into the container (prefill).
      command: bash -c "{{ docker_cp_prefill_code_cmd }}"
      when: "'P' in group_names"
      tags: sync_code

    - name: Copy the code from the host machine into the container (decode).
      command: bash -c "{{ docker_cp_decode_code_cmd }}"
      when: "'D' in group_names"
      tags: sync_code

    - name: Copy the code from the host machine into the container(proxy).
      command: bash -c "{{ docker_cp_proxy_code_cmd }}"
      when: "'C' in group_names"
      tags: sync_code

    - name: docker_update_proxy_code_cmd.
      command: bash -c "{{ docker_update_proxy_code_cmd }}"
      when: "'C' in group_names"
      tags: pip_install

    - name: docker_update_prefill_code_cmd.
      command: bash -c "{{ docker_update_prefill_code_cmd }}"
      when: "'P' in group_names"
      tags: pip_install

    - name: docker_update_decode_code_cmd.
      command: bash -c "{{ docker_update_decode_code_cmd }}"
      when: "'D' in group_names"
      tags: pip_install

    - name: Register all values.
      set_fact:
        PREFILL_API_SERVER_LIST: >-
          {% set result=[] %}
          {% for host in groups['P']|default([]) %}
            {% set h=hostvars.get(host,{}) %}
            {% set ansible_host_val=h.ansible_host|default('') %}
            {% set host_ip_val=h.host_ip|default('') %}
            {% set api_port_val=h.api_port|default('9000') %}
            {% if ansible_host_val and host_ip_val and ansible_host_val == host_ip_val %}
              {% set entry=ansible_host_val~':'~api_port_val %}
              {% if entry not in result %}
              {% set _=result.append(entry) %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ result|join(',') }}
        DECODE_API_SERVER_LIST: >-
          {% set result=[] %}
          {% for host in groups['D']|default([]) %}
            {% set h=hostvars.get(host,{}) %}
            {% set ip=h.ansible_host|default('') %}
            {% set port=h.api_port|default('9100') %}
            {% set num=h.ascend_rt_visible_devices.count(',')|default('0') %}
            {% if ip %}
              {% set entry=ip~':'~port~'@'~num %}
              {% if entry not in result %}
                {% set _=result.append(entry) %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ result | join(',') }}
        PREFILL_POD_NUM: >-
          {{
            groups['P'] |
            map('extract', hostvars) |
            map(attribute='host_ip') |
            unique |
            length
          }}
        DECODE_POD_NUM: 1
        DECODE_SERVER_IP_LIST: >-
          {% set host_list = [] %}
          {% for host in groups['D'] %}
            {% if hostvars[host].host_ip == hostvars[host].ansible_host %}
              {% set _ = host_list.insert(0, hostvars[host].ansible_host) %}
            {% else %}
              {% set _ = host_list.append(hostvars[host].ansible_host) %}
            {% endif %}
          {% endfor %}
          {{ host_list | join(',') }}
        DECODE_SERVER_ALL: "{{ groups['D'] | map('extract', hostvars) | map(attribute='ascend_rt_visible_devices') | select('defined') | join(',') }}"
        DECODE_SERVER_OFFSET: "{% set offsets = {} %}{% set ns = namespace(cnt=0) %}{% for host in groups['D']|default([]) %}{% set _ = offsets.update({host: ns.cnt}) %}{% set num=hostvars[host].ascend_rt_visible_devices.count(',')|default('0')|int %}{% set ns.cnt = ns.cnt + num + 1 %}{% endfor %}{{ offsets }}"
      run_once: yes
      delegate_to: localhost
      tags: always

    - name: Register values for prefill.
      set_fact:
        NODE_IP_LIST: >-
          {{
            groups['P'] |
            map('extract', hostvars) |
            selectattr('host_ip', '==', host_ip) |
            map(attribute='ansible_host') |
            unique |
            join(',')
          }}
        NNODES: >-
          {{
            groups['P'] |
            map('extract', hostvars) |
            selectattr('host_ip', '==', host_ip) |
            list |
            length
          }}
      when: "'P' in group_names"
      tags: always

    - name: Display all values.
      debug:
        msg: |
         PREFILL_API_SERVER_LIST: {{ PREFILL_API_SERVER_LIST }}
         DECODE_API_SERVER_LIST: {{ DECODE_API_SERVER_LIST }}
         DECODE_SERVER_IP_LIST: {{ DECODE_SERVER_IP_LIST }}
         PREFILL_POD_NUM: {{ PREFILL_POD_NUM }}
         DECODE_NUM_DP: {{ DECODE_SERVER_ALL.count(',') + 1 }} 
         DECODE_SERVER_OFFSET: {{ DECODE_SERVER_OFFSET }}
         NODE_IP_LIST: {{ NODE_IP_LIST }}
         NNODES: {{ NNODES }}
      run_once: yes
      delegate_to: localhost
      tags: always

    - name: Create scripts directory.
      ansible.builtin.file:
        path: "{{ SCRIPTS_PATH }}"
        state: directory
        mode: '0750'
      when: "'P' in group_names or 'D' in group_names or 'C' in group_names"
      tags: always

    - name: Create log directory on remote nodes.
      ansible.builtin.file:
        path: "{{ LOG_PATH }}"
        state: directory
        mode: '0750'
      when: "'P' in group_names or 'D' in group_names or 'C' in group_names"
      tags: always

    - name: Create log directory on executor.
      ansible.builtin.file:
        path: "{{ LOG_PATH_IN_EXECUTOR }}"
        state: directory
        mode: '0750'
      delegate_to: localhost
      run_once: yes
      tags: always

    - name: Generate a script to kill all Python processes in the container.
      copy:
        content: "{{ kill_python_processes_cmd }}"
        dest: "{{ SCRIPTS_PATH }}/kill_python_processes.sh"
        mode: '0750'
      when: "'P' in group_names or 'D' in group_names"
      tags: stop_server

    - name: Generate a script to kill all Ray processes in the container. 
      copy:
        content: "{{ kill_ray_processes_cmd }}"
        dest: "{{ SCRIPTS_PATH }}/kill_ray_processes.sh"
        mode: '0750'
      when: "'P' in group_names or 'D' in group_names"
      tags: stop_server

    - name: Kill all Python processes in the container of prefill.
      command: /bin/bash -c "{{ docker_exec_cmd }} {{ ACTUAL_DOCKER_NAME_P }} /bin/bash -c {{ SCRIPTS_PATH }}/kill_python_processes.sh"
      failed_when: false
      no_log: true
      when: "'P' in group_names"
      tags: stop_server

    - name: Kill all Ray processes in the container of prefill.
      command: /bin/bash -c "{{ docker_exec_cmd }} {{ ACTUAL_DOCKER_NAME_P }} /bin/bash -c {{ SCRIPTS_PATH }}/kill_ray_processes.sh"
      failed_when: false
      no_log: true
      when: "'P' in group_names"
      tags: stop_server

    - name: Kill all Python processes in the container of decode.
      command: /bin/bash -c "{{ docker_exec_cmd }} {{ ACTUAL_DOCKER_NAME_D }} /bin/bash -c {{ SCRIPTS_PATH }}/kill_python_processes.sh"
      failed_when: false
      no_log: true
      when: "'D' in group_names"
      tags: stop_server

    - name: Kill all Ray processes in the container of decode.
      command: /bin/bash -c "{{ docker_exec_cmd }} {{ ACTUAL_DOCKER_NAME_D }} /bin/bash -c {{ SCRIPTS_PATH }}/kill_ray_processes.sh"
      failed_when: false
      no_log: true
      when: "'D' in group_names"
      tags: stop_server

    - name: Set mooncake & etcd configuration.
      set_fact:
        ETCD_IP: "{{ hostvars[groups['C'][0]]['ansible_host'] }}"
        ETCD_PORT: "{{ etcd_port }}"
        MOONCAKE_MASTER_IP: "{{ hostvars[groups['C'][0]]['ansible_host'] }}"
        MOONCAKE_MASTER_PORT: "{{ mooncake_master_port }}"
        MOONCAKE_METRICS_PORT: "{{ mooncake_metrics_port }}"
        PROXY_PORT: "{{ proxy_port }}"
      when: "('P' in group_names or 'D' in group_names or 'C' in group_names) and etcd_port is defined and mooncake_master_port is defined and mooncake_metrics_port is defined"
      tags:
        - stop_server
        - run_server

    - name: Kill Mooncake master pod.
      command: /bin/bash -c "kill -9 $(netstat -tulpn | grep :{{ MOONCAKE_MASTER_PORT }} | awk '{print $7}' | grep -oP '\d+')"
      failed_when: false
      when: "'C' in group_names and etcd_port is defined and mooncake_master_port is defined and mooncake_metrics_port is defined"
      tags:
        - stop_server
        - run_server

    - name: Kill etcd pod.
      command: /bin/bash -c "kill -9 $(netstat -tulpn | grep :{{ ETCD_PORT }} | awk '{print $7}' | grep -oP '\d+')"
      failed_when: false
      when: "'C' in group_names and etcd_port is defined and mooncake_master_port is defined and mooncake_metrics_port is defined"
      tags:
        - stop_server
        - run_server

    - name: Generate a mooncake config json.
      copy:
        content: "{{ generate_mooncake_config_json }}"
        dest: "{{ SCRIPTS_PATH }}/mooncake_config.json"
        mode: '0750'
      vars:
        HOST_IP: "{{ ansible_host }}"
      when: "('P' in group_names or 'D' in group_names) and etcd_port is defined and mooncake_master_port is defined and mooncake_metrics_port is defined"
      tags: run_server

    - name: Generate a lmcahce + mooncake config yaml.
      copy:
        content: "{{ generate_lmcache_mooncake_config_yml }}"
        dest: "{{ SCRIPTS_PATH }}/lmcache_mooncake_config.yml"
        mode: '0750'
      when: "('P' in group_names or 'D' in group_names) and etcd_port is defined and mooncake_master_port is defined and mooncake_metrics_port is defined"
      tags: run_server

    - name: Remove proc_trace.txt if it exists (P & D nodes)
      ansible.builtin.file:
        path: /tmp/process/proc_trace.txt
        state: absent
      when: "'P' in group_names or 'D' in group_names"
      tags:
        - run_server

    - name: Generate a script to run the vllm server for the prefill instances.
      copy:
        content: "{{ run_vllm_server_prefill_cmd }}"
        dest: "{{ SCRIPTS_PATH }}/vllm_run_for_p.sh"
        mode: '0750'
      when: "'P' in group_names"
      tags:
        - run_server

    - name: Generate a script to run the vllm server for the decode instances.
      copy:
        content: "{{ run_vllm_server_decode_cmd }}"
        dest: "{{ SCRIPTS_PATH }}/vllm_run_for_d.sh"
        mode: '0750'
      vars:
        server_offset_dict: "{{ DECODE_SERVER_OFFSET }}"
      when: "'D' in group_names"
      tags:
        - run_server

    - name: Get socket name for communication between prefill instances and decode instances.
      shell: |
        ip -4 route list 0/0 | awk '{print $5}' | head -1
      register: default_interface_result
      changed_when: false
      tags:
        - run_server

    - name: Use a variable to store the socket name.
      set_fact:
        default_interface: "{{ default_interface_result.stdout }}"
      when: default_interface_result.stdout != ""
      tags:
        - run_server

    - name: Run the Omniai service for prefill instances.
      command: bash -c "{{ docker_start_vllm_cmd_p }}"
      environment:
        ROLE: "P"
        NODE_PORT: "{{ node_port }}"
        PREFILL_SERVER_LIST: "{{ ascend_rt_visible_devices }}"
        API_PORT: "{{ api_port }}"
        SERVER_IP_LIST: "{{ DECODE_SERVER_IP_LIST | replace(' ', '') | trim }}"
        PREFILL_POD_NUM: "{{ PREFILL_POD_NUM }}"
        SOCKET_IFNAME: "{{ default_interface }}"
        IP: "{{ ansible_host }}"
        HOST_IP: "{{ host_ip }}"
        KV_RANK: "{{ kv_rank }}"
        NODE_RANK: "{{ node_rank }}"
        PREFILL_TENSOR_PARALLEL_SIZE: "{{ ascend_rt_visible_devices.split(',') | length }}"
        NNODES: "{{ NNODES }}"
        NODE_IP_LIST: "{{ NODE_IP_LIST }}"
        MOONCAKE_CONFIG_PATH: "{{ SCRIPTS_PATH }}/mooncake_config.json"
        LMCACHE_MOONCAKE_CONFIG_PATH: "{{ SCRIPTS_PATH }}/lmcache_mooncake_config.yml"
      when: "'P' in group_names and (NODE_IP_LIST | string).split(',') | length >= 2"
      tags:
        - run_server

    - name: Wait 20 seconds.
      pause:
        seconds: 20  # Support decimals（such as 0.5s）
      when: "(NODE_IP_LIST | string).split(',') | length >= 2"
      tags:
        - run_server

    - name: Run the Omniai service for decode instances.
      command: bash -c "{{ docker_start_vllm_cmd_d }}"
      environment:
        ROLE: "D"
        NODE_PORT: "{{ node_port }}"
        API_PORT: "{{ api_port }}"
        DECODE_SERVER_LIST: "{{ ascend_rt_visible_devices }}"
        SERVER_IP_LIST: "{{ DECODE_SERVER_IP_LIST | replace(' ', '') | trim }}"
        PREFILL_POD_NUM: "{{ PREFILL_POD_NUM }}"
        DECODE_POD_NUM: "{{ DECODE_POD_NUM }}"
        SOCKET_IFNAME: "{{ default_interface }}"
        NUM_SERVERS: "{{ ascend_rt_visible_devices.split(',') | length }}"
        HOST_IP: "{{ host_ip }}"
        HOST: "{{ inventory_hostname }}"
        MOONCAKE_CONFIG_PATH: "{{ SCRIPTS_PATH }}/mooncake_config.json"
        LMCACHE_MOONCAKE_CONFIG_PATH: "{{ SCRIPTS_PATH }}/lmcache_mooncake_config.yml"
      when: "'D' in group_names"
      tags:
        - run_server

    - name: Run the Omniai service for prefill instances.
      command: bash -c "{{ docker_start_vllm_cmd_p }}"
      environment:
        ROLE: "P"
        NODE_PORT: "{{ node_port }}"
        PREFILL_SERVER_LIST: "{{ ascend_rt_visible_devices }}"
        API_PORT: "{{ api_port }}"
        SERVER_IP_LIST: "{{ DECODE_SERVER_IP_LIST | replace(' ', '') | trim }}"
        PREFILL_POD_NUM: "{{ PREFILL_POD_NUM }}"
        SOCKET_IFNAME: "{{ default_interface }}"
        IP: "{{ ansible_host }}"
        HOST_IP: "{{ host_ip }}"
        KV_RANK: "{{ kv_rank }}"
        NODE_RANK: "{{ node_rank }}"
        PREFILL_TENSOR_PARALLEL_SIZE: "{{ ascend_rt_visible_devices.split(',') | length }}"
        NNODES: "{{ NNODES }}"
        NODE_IP_LIST: "{{ NODE_IP_LIST }}"
        MOONCAKE_CONFIG_PATH: "{{ SCRIPTS_PATH }}/mooncake_config.json"
        LMCACHE_MOONCAKE_CONFIG_PATH: "{{ SCRIPTS_PATH }}/lmcache_mooncake_config.yml"
      when: "'P' in group_names and (NODE_IP_LIST | string).split(',') | length == 1"
      tags:
        - run_server
      
    
    - name: Wait for vLLM service to be ready in container D
      ansible.builtin.shell:
        cmd: |
          timeout=300
          while [ $timeout -gt 0 ]; do
            if docker exec {{ ACTUAL_DOCKER_NAME_D }} grep -q "Application startup complete" ${LOG_PATH}/{{ inventory_hostname }}/server_0.log; then
              echo "Service ready"
              exit 0
            fi
            sleep 20
            timeout=$((timeout - 20))
          done
          echo "Timeout waiting for service" >&2
          exit 1
      environment:
        LOG_PATH: "{{ LOG_PATH }}"
      when:
        - "'D' in group_names"
        - "proc_bind_enabled | default(false)"
      tags:
        - proc_bind


    - name: Ensure bind_cpu.sh is executable in the container
      ansible.builtin.shell:
        cmd: docker exec {{ ACTUAL_DOCKER_NAME_P }} chmod +x /workspace/omniinfer/tools/scripts/bind_cpu.sh
      when: "'P' in group_names"
      tags:
        - proc_bind

    - name: Ensure bind_cpu.sh is executable in the container
      ansible.builtin.shell:
        cmd: docker exec {{ ACTUAL_DOCKER_NAME_D }} chmod +x /workspace/omniinfer/tools/scripts/bind_cpu.sh
      when: "'D' in group_names"
      tags:
        - proc_bind

    - name: Prefill cpu_pin
      command: /bin/bash -c "{{ docker_exec_cmd }} -e ROLE=P {{ ACTUAL_DOCKER_NAME_P }} /bin/bash -c /workspace/omniinfer/tools/scripts/bind_cpu.sh"
      become: yes
      when:
        - "'P' in group_names"
        - "proc_bind_enabled | default(false)"
      tags:
        - proc_bind

    - name: Decode cpu_pin
      command: /bin/bash -c "{{ docker_exec_cmd }} -e ROLE=D {{ ACTUAL_DOCKER_NAME_D }} /bin/bash -c /workspace/omniinfer/tools/scripts/bind_cpu.sh"
      become: yes
      when:
        - "'D' in group_names"
        - "proc_bind_enabled | default(false)"
      tags:
        - proc_bind

    - name: Generate a script to kill all nginx processes in the container.
      copy:
        content: "{{ kill_nginx_processes_cmd }}"
        dest: "{{ SCRIPTS_PATH }}/kill_nginx_processes.sh"
        mode: '0750'
      when: "'C' in group_names"
      tags: run_proxy

    - name: Kill all Python processes in the container of proxy.
      command: /bin/bash -c "{{ docker_exec_cmd }} {{ ACTUAL_DOCKER_NAME_C }} /bin/bash -c {{ SCRIPTS_PATH }}/kill_nginx_processes.sh"
      failed_when: false
      no_log: true
      when: "'C' in group_names"
      tags: run_proxy

    - name: Generate a script to run the global proxy server.
      copy:
        content: "{{ run_proxy_cmd }}"
        dest: "{{ SCRIPTS_PATH }}/run_proxy_server.sh"
        mode: '0750'
      when: "'C' in group_names"
      tags:
        - run_proxy

    - name: Run the global proxy server.
      command: bash -c "{{ docker_start_proxy_cmd_c }}"
      when: "'C' in group_names"
      tags:
        - run_proxy

    - name: Create a directory on the executor to store the log.
      ansible.builtin.file:
        path: "{{ LOG_PATH_IN_EXECUTOR }}/{{ inventory_hostname }}"
        state: directory
      when: "'P' in group_names or 'D' in group_names or 'C' in group_names"
      delegate_to: localhost
      tags:
        - fetch_log

    - name: Forward logs from all machines to the executor.
      ansible.builtin.synchronize:
        mode: pull
        src: "{{ LOG_PATH }}/{{ inventory_hostname }}/"
        dest: "{{ LOG_PATH_IN_EXECUTOR }}/{{ inventory_hostname }}/"
      when: "'P' in group_names or 'D' in group_names or 'C' in group_names"
      tags:
        - fetch_log
