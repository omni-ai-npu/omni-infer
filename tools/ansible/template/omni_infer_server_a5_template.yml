    # --additional-config "$ADDITIONAL_CONFIG" \

    run_proxy_cmd: |
      #!/bin/bash
      . ~/.bashrc
      # Source custom ops environment
      source /usr/local/Ascend/cann/opp/vendors/omni_custom_ops/bin/set_env.bash
      source /usr/local/Ascend/cann/opp/vendors/omni_training_custom_ops/bin/set_env.bash
      # source /usr/local/Ascend/ascend-toolkit/latest/opp/vendors/omni_custom_ops/bin/set_env.bash # 按需配置，安装自定义算子包时需要source的环境路径

      export PYTHONHASHSEED=123

      prefill_result="{{ PREFILL_API_SERVER_LIST }}"
      prefill_result=`echo "$prefill_result" | awk '$1=$1'`

      decode_result=""
      decode_api_servers="{{ DECODE_API_SERVER_LIST }}"
      decode_api_servers=`echo "$decode_api_servers" | awk '$1=$1'`
      decode_array=(${decode_api_servers//,/ })
      for var in ${decode_array[@]}; do
        address=${var%@*}
        ip=${address%:*}
        port=${address#*:}
        num=${var#*@}
        for ((i=0; i<=$num;i++)); do
          if [[ -z ${decode_result} ]]; then
            decode_result="$ip:$port"
          else
            decode_result="${decode_result},$ip:$port"
          fi
          ((port++))
        done
      done
      # notice
      if [ ${USE_OMNI_PROXY} = "1" ]; then
        # cd /workspace/omniinfer/omni/accelerators/sched/omni_proxy
        # bash build.sh --skip-extras
        cd /workspace/omniinfer/components/omni-proxy/omni_proxy/
        bash omni_proxy.sh \
          --listen-port "$PROXY_NODE_PORT" \
          --prefill-endpoints "$prefill_result" \
          --decode-endpoints "$decode_result" \
          --log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_error.log \
          --log-level notice \
          --access-log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_access.log \
          --core-num 4 \
          --start-core-index 16 \
          --omni-proxy-pd-policy sequential \
          --omni-proxy-model-path $MODEL_PATH \
          --omni-proxy-max-batch-num-token 100000 \
          --omni-proxy-prefill-max-num-seqs 32 \
          --omni-proxy-decode-max-num-seqs 6
      else
        cd /workspace/omniinfer/tools/scripts
        bash global_proxy.sh \
          --listen-port "$PROXY_NODE_PORT" \
          --prefill-servers-list "$prefill_result" \
          --decode-servers-list "$decode_result" \
          --log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_error.log \
          --log-level notice \
          --access-log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_access.log \
          --core-num 4 \
          --start-core-index 16 \
          --prefill-lb-sdk ${PREFILL_LB_SDK} \
          --decode-lb-sdk ${DECODE_LB_SDK} \
          --prefill-max-num-seqs 32 \
          --decode-max-num-seqs 6
      fi

    generate_mooncake_config_json: |
