        "metadata_server": "etcd://{{ ETCD_IP }}:{{ ETCD_PORT }}",
        "local_hostname": "{{ HOST_IP }}",
        "protocol": "tcp",
        "transfer_timeout": 60,
        "global_segment_size": 17179869184,
        "master_server_address": "{{ MOONCAKE_MASTER_IP }}:{{ MOONCAKE_MASTER_PORT }}"
      }

    generate_lmcache_mooncake_config_yml: |
      # 256 Tokens per kV Chunk
      chunk_size: 256
      # Enable CPU memory backend
      local_cpu: false # default
      # 5GB of Pinned CPU memory
      max_local_cpu_size: 5.0 # default
      
      remote_url: "mooncakestore://{{ MOONCAKE_MASTER_IP }}:{{ MOONCAKE_MASTER_PORT }}"
      remote_serde: "naive"
      external_lookup_client: "mooncakestore://{{ MOONCAKE_MASTER_IP }}:{{ MOONCAKE_MASTER_PORT }}"

      extra_config:
        retmote_enable_mla_worker_id_as0: true

    kill_python_processes_cmd: |
      #!/bin/bash

      ps aux | grep "VLLM" | grep -v "grep" | awk '{print $2}' | xargs kill -9
      ps aux | grep "vllm" | grep -v "grep" | awk '{print $2}' | xargs kill -9
      ps aux | grep "python" | grep -v "grep" | awk '{print $2}' | xargs kill -9

    kill_nginx_processes_cmd: |
      #!/bin/bash

      ps aux | grep "nginx" | grep -v "grep" | awk '{print $2}' | xargs kill -9

    kill_ray_processes_cmd: |
      #!/bin/bash

      ps aux | grep "ray" | grep -v "grep" | awk '{print $2}' | xargs kill -9

    start_docker_cmd_p: >
      {{ docker_run_cmd }}
      -d --name $DOCKER_NAME_P $DOCKER_IMAGE_ID

    start_docker_cmd_d: >
      {{ docker_run_cmd }}
      -d --name $DOCKER_NAME_D $DOCKER_IMAGE_ID

    start_docker_cmd_c: >
      {{ docker_run_cmd }}
      -e PROXY_NODE_PORT=$NODE_PORT
      -d --name $DOCKER_NAME_C $DOCKER_IMAGE_ID


    docker_start_vllm_cmd_p: >
      {{ docker_exec_cmd }}
      -e MODEL_PATH=$MODEL_PATH
      -e MODEL_LEN_MAX_PREFILL=$MODEL_LEN_MAX_PREFILL
      -e PREFILL_SERVER_LIST=$PREFILL_SERVER_LIST
      -e PREFILL_TENSOR_PARALLEL_SIZE=$PREFILL_TENSOR_PARALLEL_SIZE
      -e DECODE_TENSOR_PARALLEL_SIZE=$DECODE_TENSOR_PARALLEL_SIZE
      -e IP=$IP
      -e HOST_IP=$HOST_IP
      -e MASTER_PORT=$NODE_PORT
      -e API_PORT=$API_PORT
      -e SERVER_IP_LIST=$SERVER_IP_LIST
      -e PREFILL_POD_NUM=$PREFILL_POD_NUM
      -e SOCKET_IFNAME=$SOCKET_IFNAME
      -e KV_RANK=$KV_RANK
      -e NNODES=$NNODES
      -e NODE_RANK=$NODE_RANK
      -e NODE_IP_LIST=$NODE_IP_LIST
      -e KV_CONNECTOR=$KV_CONNECTOR
      -e ENABLE_OMNI_CACHE=$ENABLE_OMNI_CACHE
      -e DISABLE_GATHER_SELECTION=$DISABLE_GATHER_SELECTION
      -e P_NODE_LIST=$P_NODE_LIST
      -e OMNI_CACHE_LAYER_BYTES=$OMNI_CACHE_LAYER_BYTES
      -e MAP_SIZE_BYTES=$MAP_SIZE_BYTES
      -e OMNI_CACHE_PREFILL_MMAP_FILE=$OMNI_CACHE_PREFILL_MMAP_FILE
      -e OMNI_CACHE_PREFILL_NUM_GPU_BLOCKS_OVERRIDE=$OMNI_CACHE_PREFILL_NUM_GPU_BLOCKS_OVERRIDE
      -e HYBRID_ATTN_GROUP_SIZE=$HYBRID_ATTN_GROUP_SIZE
      -e NUM_DIE_PER_MACH=$NUM_DIE_PER_MACH
      -e BASE_PORT=$BASE_PORT
      -e ZMQ_BASE_PORT=$ZMQ_BASE_PORT
      -e OMNI_CACHE_MLA_SWA_DEBUG=$OMNI_CACHE_MLA_SWA_DEBUG
      -e MOONCAKE_CONFIG_PATH=$MOONCAKE_CONFIG_PATH
      -e LMCACHE_MOONCAKE_CONFIG_PATH=$LMCACHE_MOONCAKE_CONFIG_PATH
      -e USE_OMNI_PROXY=$USE_OMNI_PROXY
      -d $DOCKER_NAME_P
      /bin/bash -c $SCRIPTS_PATH/vllm_run_for_p.sh

    docker_start_vllm_cmd_d: >
      {{ docker_exec_cmd }}
      -e MODEL_PATH=$MODEL_PATH
      -e MODEL_LEN_MAX_DECODE=$MODEL_LEN_MAX_DECODE
      -e DECODE_SERVER_LIST=$DECODE_SERVER_LIST
      -e DECODE_TENSOR_PARALLEL_SIZE=$DECODE_TENSOR_PARALLEL_SIZE
      -e DECODE_DATA_PARALLEL_SIZE=$DECODE_DATA_PARALLEL_SIZE
      -e HOST_IP=$HOST_IP
      -e MASTER_PORT=$NODE_PORT
      -e API_PORT=$API_PORT
      -e SERVER_IP_LIST=$SERVER_IP_LIST
      -e PREFILL_POD_NUM=$PREFILL_POD_NUM
      -e DECODE_POD_NUM=$DECODE_POD_NUM
      -e SOCKET_IFNAME=$SOCKET_IFNAME
      -e NUM_SERVERS=$NUM_SERVERS
      -e HOST=$HOST
      -e KV_CONNECTOR=$KV_CONNECTOR
      -e ENABLE_OMNI_CACHE=$ENABLE_OMNI_CACHE
      -e DISABLE_GATHER_SELECTION=$DISABLE_GATHER_SELECTION
      -e ENABLE_HOST_MAPPING=$ENABLE_HOST_MAPPING
      -e P_NODE_LIST=$P_NODE_LIST
      -e OMNI_CACHE_LAYER_BYTES=$OMNI_CACHE_LAYER_BYTES
      -e MAP_SIZE_BYTES=$MAP_SIZE_BYTES
      -e OMNI_CACHE_DECODE_MMAP_FILE=$OMNI_CACHE_DECODE_MMAP_FILE
      -e OMNI_CACHE_DECODE_NUM_GPU_BLOCKS_OVERRIDE=$OMNI_CACHE_DECODE_NUM_GPU_BLOCKS_OVERRIDE
      -e ENABLE_OMNI_CACHE_DSA_SPLIT=$ENABLE_OMNI_CACHE_DSA_SPLIT
      -e OMNI_CACHE_DSA_MMAP_FILE=$OMNI_CACHE_DSA_MMAP_FILE
      -e HYBRID_ATTN_GROUP_SIZE=$HYBRID_ATTN_GROUP_SIZE
      -e NUM_DIE_PER_MACH=$NUM_DIE_PER_MACH
      -e BASE_PORT=$BASE_PORT
      -e ZMQ_BASE_PORT=$ZMQ_BASE_PORT
      -e OMNI_CACHE_MLA_SWA_DEBUG=$OMNI_CACHE_MLA_SWA_DEBUG
      -e MOONCAKE_CONFIG_PATH=$MOONCAKE_CONFIG_PATH
      -e LMCACHE_MOONCAKE_CONFIG_PATH=$LMCACHE_MOONCAKE_CONFIG_PATH
      -d $DOCKER_NAME_D
      /bin/bash -c $SCRIPTS_PATH/vllm_run_for_d.sh

    docker_start_proxy_cmd_c: >
      {{ docker_exec_cmd }}
      -e PREFILL_LB_SDK=$PREFILL_LB_SDK
      -e DECODE_LB_SDK=$DECODE_LB_SDK
      -e USE_OMNI_PROXY=$USE_OMNI_PROXY
      -e MODEL_PATH=$MODEL_PATH
      -d $DOCKER_NAME_C
      /bin/bash -c $SCRIPTS_PATH/run_proxy_server.sh

    docker_cp_prefill_code_cmd: "docker exec $DOCKER_NAME_P rm -rf /workspace/omniinfer/components/omni-npu && docker exec $DOCKER_NAME_P rm -rf /workspace/omniinfer/components/omni-models && docker cp {{ ansible_env.CODE_PATH }}/omniinfer/components/omni-npu $DOCKER_NAME_P:/workspace/omniinfer/components/ && docker cp {{ ansible_env.CODE_PATH }}/omniinfer/components/omni-models $DOCKER_NAME_P:/workspace/omniinfer/components/ && docker cp {{ ansible_env.CODE_PATH }}/omniinfer/components/omni-cache $DOCKER_NAME_P:/workspace/omniinfer/components/"

    docker_cp_decode_code_cmd: "docker exec $DOCKER_NAME_D rm -rf /workspace/omniinfer/components/omni-npu && docker exec $DOCKER_NAME_D rm -rf /workspace/omniinfer/components/omni-models && docker cp {{ ansible_env.CODE_PATH }}/omniinfer/components/omni-npu $DOCKER_NAME_D:/workspace/omniinfer/components/ && docker cp {{ ansible_env.CODE_PATH }}/omniinfer/components/omni-models $DOCKER_NAME_D:/workspace/omniinfer/components/ && docker cp {{ ansible_env.CODE_PATH }}/omniinfer/components/omni-cache $DOCKER_NAME_D:/workspace/omniinfer/components/"

    docker_cp_proxy_code_cmd: "docker cp {{ ansible_env.CODE_PATH }}/omni-proxy $DOCKER_NAME_C:/workspace/omniinfer/components/"
    docker_update_proxy_code_cmd: >
      {{ docker_exec_cmd }}
      -e KV_CONNECTOR=$KV_CONNECTOR
      $DOCKER_NAME_C
      /bin/bash -c 'source ~/.bashrc && git config --global http.proxy "http://p_atlas:proxy%40123@172.19.90.131:8080" && git config --global https.proxy "http://p_atlas:proxy%40123@172.19.90.131:8080" && git config --global http.sslverify false && git config --global https.sslverify false && export http_proxy='http://p_atlas:proxy%40123@172.18.100.92:8080' && export https_proxy=$http_proxy && cd /workspace/omniinfer/omni-proxy/ && bash build/build.sh > ${LOG_PATH}/{{ inventory_hostname }}/install.log;'
    docker_update_prefill_code_cmd: >
      {{ docker_exec_cmd }}
      -e KV_CONNECTOR=$KV_CONNECTOR
      $DOCKER_NAME_P
      /bin/bash -c '. ~/.bashrc && git config --global http.proxy "http://p_atlas:proxy%40123@172.19.90.131:8080" && git config --global https.proxy "http://p_atlas:proxy%40123@172.19.90.131:8080" && git config --global http.sslverify false && git config --global https.sslverify false && export http_proxy=http://p_llmdevops:4A_dq%21R_@172.18.100.92:8080/ && export https_proxy=$http_proxy && cd /workspace/omniinfer/build && git config --global --add safe.directory /workspace/omniinfer && pip uninstall omni_infer -y && cd /workspace/omniinfer/components/omni-npu && pip install -e . --no-build-isolation && cd /workspace/omniinfer/components/omni-cache && pip install -e . --no-build-isolation && cd /workspace/omniinfer/components/omni-models && bash build/build.sh > ${LOG_PATH}/{{ inventory_hostname }}/install.log;'
    docker_update_decode_code_cmd: >
      {{ docker_exec_cmd }}
      -e KV_CONNECTOR=$KV_CONNECTOR
      $DOCKER_NAME_D
      /bin/bash -c '. ~/.bashrc && git config --global http.proxy "http://p_atlas:proxy%40123@172.19.90.131:8080" && git config --global https.proxy "http://p_atlas:proxy%40123@172.19.90.131:8080" && git config --global http.sslverify false && git config --global https.sslverify false && export http_proxy=http://p_llmdevops:4A_dq%21R_@172.18.100.92:8080/ && export https_proxy=$http_proxy && cd /workspace/omniinfer/build && git config --global --add safe.directory /workspace/omniinfer && pip uninstall omni_infer -y && cd /workspace/omniinfer/components/omni-npu && pip install -e . --no-build-isolation && cd /workspace/omniinfer/components/omni-cache && pip install -e . --no-build-isolation && cd /workspace/omniinfer/components/omni-models && bash build/build.sh > ${LOG_PATH}/{{ inventory_hostname }}/install.log;'
  tasks:
    - name: generate container name.
      set_fact:
        ACTUAL_DOCKER_NAME_P: "{{ ansible_env.DOCKER_NAME_P }}_{{inventory_hostname}}"
        ACTUAL_DOCKER_NAME_D: "{{ ansible_env.DOCKER_NAME_D }}_{{inventory_hostname}}"
        ACTUAL_DOCKER_NAME_C: "{{ ansible_env.DOCKER_NAME_C }}_{{inventory_hostname}}"
        # ACTUAL_DOCKER_NAME_P: "{{ ansible_env.DOCKER_NAME_P }}"
        # ACTUAL_DOCKER_NAME_D: "{{ ansible_env.DOCKER_NAME_D }}"
        # ACTUAL_DOCKER_NAME_C: "{{ ansible_env.DOCKER_NAME_C }}"
      when: "'P' in group_names or 'D' in group_names or 'C' in group_names"
      tags: always

    - name: Check and delete Prefill/Decode group Docker containers.
      block:
        - name: Check whether the container exists.
          shell: |
            docker inspect --format='{{"{{.Name}}"}}' \
            $DOCKER_NAME_P $DOCKER_NAME_D \
            2>/dev/null | grep -v '^$'
          register: existing_containers
          environment:
            DOCKER_NAME_P: "{{ ACTUAL_DOCKER_NAME_P }}"
            DOCKER_NAME_D: "{{ ACTUAL_DOCKER_NAME_D }}"
          failed_when: false
          changed_when: false

        - name: Show generated container name.
          debug:
            msg: "Generated container name: {{ existing_containers.stdout_lines }}"

        - name: Stop containers.
          command: |
            /bin/bash -c "docker stop {{ existing_containers.stdout_lines | join(' ') }}"
          when: existing_containers.stdout != ""

        - name: Delete containers.
          command: |
            /bin/bash -c "docker rm -f {{ existing_containers.stdout_lines | join(' ') }}"
          when: existing_containers.stdout != ""
      when: "'P' in group_names or 'D' in group_names"
      tags:
        - run_docker
        - clean_up

    - name: Check and delete containers used for global proxy server.
      block:
        - name: Check whether the container exists.
          shell: |
            docker inspect --format='{{"{{.Name}}"}}' \
            $DOCKER_NAME_C \
            2>/dev/null | grep -v '^$'
          register: existing_containers
          environment:
            DOCKER_NAME_C: "{{ ACTUAL_DOCKER_NAME_C }}"
          failed_when: false
          changed_when: false

        - name: Show generated container name.
          debug:
            msg: "Generated container name: {{ existing_containers.stdout_lines }}"

        - name: Stop containers.
          command: |
            /bin/bash -c "docker stop {{ existing_containers.stdout_lines | join(' ') }}"
          when: existing_containers.stdout != ""

        - name: Delete containers.
          command: |
            /bin/bash -c "docker rm -f {{ existing_containers.stdout_lines | join(' ') }}"
          when: existing_containers.stdout != ""
      when: "'C' in group_names"
      tags:
        - run_docker
        - clean_up

    - name: Create hixlep directory for endpoint files
      file:
        path: "/etc/hixlep"
        state: directory
        mode: '0755'
        owner: root
        group: root
      become: yes
      when: "'P' in group_names or 'D' in group_names"
      tags: run_docker

    - name: Run container for prefill instances.
      command: bash -c "{{ start_docker_cmd_p }}"
      environment:
        DOCKER_NAME_P: "{{ ACTUAL_DOCKER_NAME_P }}"
      when: "'P' in group_names"
      tags: run_docker

    - name: Run container for decode instances.
      command: bash -c "{{ start_docker_cmd_d }}"
      environment:
        DOCKER_NAME_D: "{{ ACTUAL_DOCKER_NAME_D }}"
      when: "'D' in group_names"
      tags: run_docker

    - name: Run container for global proxy server.
      command: bash -c "{{ start_docker_cmd_c }}"
      environment:
        NODE_PORT: "{{ node_port }}"
        DOCKER_NAME_C: "{{ ACTUAL_DOCKER_NAME_C }}"
      when: "'C' in group_names"
      tags:
        - run_docker

    - name: Ensure gen_route_pod.sh is executable in the container
      ansible.builtin.shell:
        cmd: >
          docker exec {{ ACTUAL_DOCKER_NAME_P if 'P' in group_names else ACTUAL_DOCKER_NAME_D }}
          chmod +x /workspace/omniinfer/tools/scripts/gen_route_pod.sh
      when: "'P' in group_names or 'D' in group_names"
      tags: run_docker

    - name: Generate route.conf using gen_route_pod.sh
      command: >
        docker exec {{ ACTUAL_DOCKER_NAME_P if 'P' in group_names else ACTUAL_DOCKER_NAME_D }}
        bash /workspace/omniinfer/tools/scripts/gen_route_pod.sh
      when: "'P' in group_names or 'D' in group_names"
      tags: run_docker

    - name: Generate endpoint configuration files using generate_ep_server_pod.py
      command: >
        docker exec {{ ACTUAL_DOCKER_NAME_P if 'P' in group_names else ACTUAL_DOCKER_NAME_D }}
        python /workspace/omniinfer/tools/scripts/generate_ep_server_pod.py --pod
      when: "'P' in group_names or 'D' in group_names"
      tags: run_docker

    - name: Create a directory to store the log.
      ansible.builtin.file:
        path: "{{ ansible_env.LOG_PATH }}/{{ inventory_hostname }}"
        state: directory
      when: "'P' in group_names or 'D' in group_names or 'C' in group_names"
      tags: run_docker

    - name: Create a directory to store the code.
      ansible.builtin.file:
        path: "{{ ansible_env.CODE_PATH }}"
        state: directory
      tags: sync_code

    - name: The executor synchronizes code to all instances.
      synchronize:
        src: "{{ ansible_env.CODE_PATH }}/"
        dest: "{{ ansible_env.CODE_PATH }}/"
        delete: yes  # 删除目标端多余文件
        recursive: yes
      when: >
        'P' in group_names or
        'D' in group_names or
        (
          'C' in group_names and
          ansible_host not in
          (groups.get('P', []) | map('extract', hostvars, 'ansible_host') | list) and
          ansible_host not in
          (groups.get('D', []) | map('extract', hostvars, 'ansible_host') | list)
        )
      tags: sync_code

    # - name: Copy the code from the host machine into the container (prefill).
    #   command: bash -c "{{ docker_cp_prefill_code_cmd }}"
    #   environment:
    #     DOCKER_NAME_P: "{{ ACTUAL_DOCKER_NAME_P }}"
    #   when: "'P' in group_names"
    #   tags: sync_code

    # - name: Copy the code from the host machine into the container (decode).
    #   command: bash -c "{{ docker_cp_decode_code_cmd }}"
    #   environment:
    #     DOCKER_NAME_D: "{{ ACTUAL_DOCKER_NAME_D }}"
    #   when: "'D' in group_names"
    #   tags: sync_code

    # - name: Copy the code from the host machine into the container(proxy).
    #   command: bash -c "{{ docker_cp_proxy_code_cmd }}"
    #   environment:
    #     DOCKER_NAME_C: "{{ ACTUAL_DOCKER_NAME_C }}"
    #   when: "'C' in group_names"
    #   tags: sync_code

    # - name: docker_update_proxy_code_cmd.
    #   command: bash -c "{{ docker_update_proxy_code_cmd }}"
    #   environment:
    #     DOCKER_NAME_C: "{{ ACTUAL_DOCKER_NAME_C }}"
    #   when: "'C' in group_names"
    #   tags: pip_install

    # - name: docker_update_prefill_code_cmd.
    #   command: bash -c "{{ docker_update_prefill_code_cmd }}"
    #   environment:
    #     DOCKER_NAME_P: "{{ ACTUAL_DOCKER_NAME_P }}"
    #   when: "'P' in group_names"
    #   tags: pip_install

    # - name: docker_update_decode_code_cmd.
    #   command: bash -c "{{ docker_update_decode_code_cmd }}"
    #   environment:
    #     DOCKER_NAME_D: "{{ ACTUAL_DOCKER_NAME_D }}"
    #   when: "'D' in group_names"
    #   tags: pip_install

    - name: Register all values.
      set_fact:
        PREFILL_API_SERVER_LIST: >-
          {% set result=[] %}
          {% for host in groups['P']|default([]) %}
            {% set h=hostvars.get(host,{}) %}
            {% set ansible_host_val=h.ansible_host|default('') %}
            {% set host_ip_val=h.host_ip|default('') %}
            {% set api_port_val=h.api_port|default('9000') %}
            {% if ansible_host_val and host_ip_val and ansible_host_val == host_ip_val %}
              {% set entry=ansible_host_val~':'~api_port_val %}
              {% if entry not in result %}
              {% set _=result.append(entry) %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ result|join(',') }}
        DECODE_API_SERVER_LIST: >-
          {% set result=[] %}
          {% for host in groups['D']|default([]) %}
            {% set h=hostvars.get(host,{}) %}
            {% set ip=h.ansible_host|default('') %}
            {% set port=h.api_port|default('9100') %}
            {% set num=h.ascend_rt_visible_devices.count(',')|default('0') %}
            {% if ip %}
              {% set entry=ip~':'~port~'@'~num %}
              {% if entry not in result %}
                {% set _=result.append(entry) %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ result | join(',') }}
        PREFILL_POD_NUM: >-
          {{
            groups['P'] |
            map('extract', hostvars) |
            map(attribute='host_ip') |
            unique |
            length
          }}
        P_NODE_LIST: >-
          {{
            groups['P'] |
            map('extract', hostvars) |
            map(attribute='host_ip') |
            unique |
            join(',')
          }}
        DECODE_POD_NUM: "{{ groups['D'] | length }}"
        DECODE_SERVER_IP_LIST: >-
          {% set host_list = [] %}
          {% for host in groups['D'] %}
            {% if hostvars[host].host_ip == hostvars[host].ansible_host %}
              {% set _ = host_list.insert(0, hostvars[host].ansible_host) %}
            {% else %}
              {% set _ = host_list.append(hostvars[host].ansible_host) %}
            {% endif %}
          {% endfor %}
          {{ host_list | join(',') }}
        DECODE_SERVER_ALL: "{{ groups['D'] | map('extract', hostvars) | map(attribute='ascend_rt_visible_devices') | select('defined') | join(',') }}"
        DECODE_SERVER_OFFSET: "{% set offsets = {} %}{% set ns = namespace(cnt=0) %}{% for host in groups['D']|default([]) %}{% set _ = offsets.update({host: ns.cnt}) %}{% set num=hostvars[host].ascend_rt_visible_devices.count(',')|default('0')|int %}{% set ns.cnt = ns.cnt + num + 1 %}{% endfor %}{{ offsets }}"
      run_once: yes
      delegate_to: localhost
      tags: always

    - name: Register values for prefill.
      set_fact:
        NODE_IP_LIST: >-
          {{
            groups['P'] |
            map('extract', hostvars) |
            selectattr('host_ip', '==', host_ip) |
            map(attribute='ansible_host') |
            unique |
            join(',')
          }}
        NNODES: >-
          {{
            groups['P'] |
            map('extract', hostvars) |
            selectattr('host_ip', '==', host_ip) |
            list |
            length
          }}
      when: "'P' in group_names"
      tags: always

    - name: Display all values.
      debug:
        msg: |
         PREFILL_API_SERVER_LIST: {{ PREFILL_API_SERVER_LIST }}
         DECODE_API_SERVER_LIST: {{ DECODE_API_SERVER_LIST }}
         DECODE_SERVER_IP_LIST: {{ DECODE_SERVER_IP_LIST }}
         PREFILL_POD_NUM: {{ PREFILL_POD_NUM }}
         P_NODE_LIST: {{ P_NODE_LIST }}
         DECODE_NUM_DP: {{ DECODE_SERVER_ALL.count(',') + 1 }} 
         DECODE_SERVER_OFFSET: {{ DECODE_SERVER_OFFSET }}
         NODE_IP_LIST: {{ NODE_IP_LIST }}
         NNODES: {{ NNODES }}
      run_once: yes
      delegate_to: localhost
      tags: proc_bind

    - name: Generate a script to kill all Python processes in the container.
      copy:
        content: "{{ kill_python_processes_cmd }}"
        dest: "$SCRIPTS_PATH/kill_python_processes.sh"
        mode: '0750'
      when: "'P' in group_names or 'D' in group_names"
      tags: stop_server

    - name: Generate a script to kill all Ray processes in the container.
      copy:
        content: "{{ kill_ray_processes_cmd }}"
        dest: "$SCRIPTS_PATH/kill_ray_processes.sh"
        mode: '0750'
      when: "'P' in group_names or 'D' in group_names"
      tags: stop_server

    - name: Kill all Python processes in the container of prefill.
      command: /bin/bash -c "{{ docker_exec_cmd }} $DOCKER_NAME_P /bin/bash -c $SCRIPTS_PATH/kill_python_processes.sh"
      environment:
        DOCKER_NAME_P: "{{ ACTUAL_DOCKER_NAME_P }}"
      failed_when: false
      no_log: true
      when: "'P' in group_names"
      tags: stop_server

    - name: Kill all Ray processes in the container of prefill.
      command: /bin/bash -c "{{ docker_exec_cmd }} $DOCKER_NAME_P /bin/bash -c $SCRIPTS_PATH/kill_ray_processes.sh"
      environment:
        DOCKER_NAME_P: "{{ ACTUAL_DOCKER_NAME_P }}"
      failed_when: false
      no_log: true
      when: "'P' in group_names"
      tags: stop_server

    - name: Kill all Python processes in the container of decode.
      command: /bin/bash -c "{{ docker_exec_cmd }} $DOCKER_NAME_D /bin/bash -c $SCRIPTS_PATH/kill_python_processes.sh"
      environment:
        DOCKER_NAME_D: "{{ ACTUAL_DOCKER_NAME_D }}"
      failed_when: false
      no_log: true
      when: "'D' in group_names"
      tags: stop_server

    - name: Kill all Ray processes in the container of decode.
      command: /bin/bash -c "{{ docker_exec_cmd }} $DOCKER_NAME_D /bin/bash -c $SCRIPTS_PATH/kill_ray_processes.sh"
      environment:
        DOCKER_NAME_D: "{{ ACTUAL_DOCKER_NAME_D }}"
      failed_when: false
      no_log: true
      when: "'D' in group_names"
      tags: stop_server

    - name: Set mooncake & etcd configuration.
      set_fact:
        ETCD_IP: "{{ hostvars[groups['C'][0]]['ansible_host'] }}"
        ETCD_PORT: "{{ etcd_port }}"
        MOONCAKE_MASTER_IP: "{{ hostvars[groups['C'][0]]['ansible_host'] }}"
        MOONCAKE_MASTER_PORT: "{{ mooncake_master_port }}"
        MOONCAKE_METRICS_PORT: "{{ mooncake_metrics_port }}"
        PROXY_PORT: "{{ proxy_port }}"
      when: "('P' in group_names or 'D' in group_names or 'C' in group_names) and etcd_port is defined and mooncake_master_port is defined and mooncake_metrics_port is defined"
      tags:
        - stop_server
        - run_server

    - name: Kill Mooncake master pod.
      command: /bin/bash -c "kill -9 $(netstat -tulpn | grep :{{ MOONCAKE_MASTER_PORT }} | awk '{print $7}' | grep -oP '\d+')"
      failed_when: false
      when: "'C' in group_names and etcd_port is defined and mooncake_master_port is defined and mooncake_metrics_port is defined"
      tags:
        - stop_server
        - run_server

    - name: Kill etcd pod.
      command: /bin/bash -c "kill -9 $(netstat -tulpn | grep :{{ ETCD_PORT }} | awk '{print $7}' | grep -oP '\d+')"
      failed_when: false
      when: "'C' in group_names and etcd_port is defined and mooncake_master_port is defined and mooncake_metrics_port is defined"
      tags:
        - stop_server
        - run_server

    - name: Wait 5 seconds.
      pause:
        seconds: 5
      when: "(NODE_IP_LIST | string).split(',') | length == 1"
      tags:
        - proc_bind

    - name: Generate a mooncake config json.
      copy:
        content: "{{ generate_mooncake_config_json }}"
        dest: "$SCRIPTS_PATH/mooncake_config.json"
        mode: '0750'
      vars:
        HOST_IP: "{{ ansible_host }}"
      when: "('P' in group_names or 'D' in group_names) and etcd_port is defined and mooncake_master_port is defined and mooncake_metrics_port is defined"
      tags: run_server

    - name: Generate a lmcahce + mooncake config yaml.
      copy:
        content: "{{ generate_lmcache_mooncake_config_yml }}"
        dest: "$SCRIPTS_PATH/lmcache_mooncake_config.yml"
        mode: '0750'
      when: "('P' in group_names or 'D' in group_names) and etcd_port is defined and mooncake_master_port is defined and mooncake_metrics_port is defined"
      tags: run_server

    - name: Remove proc_trace.txt if it exists (P & D nodes)
      ansible.builtin.file:
        path: /tmp/process/proc_trace.txt
        state: absent
      when: "'P' in group_names or 'D' in group_names"
      tags:
        - run_server

    - name: Generate a script to run the vllm server for the prefill instances.
      copy:
        content: "{{ run_vllm_server_prefill_cmd }}"
        dest: "$SCRIPTS_PATH/vllm_run_for_p.sh"
        mode: '0750'
      when: "'P' in group_names"
      tags:
        - run_server

    - name: Generate a script to run the vllm server for the decode instances.
      copy:
        content: "{{ run_vllm_server_decode_cmd }}"
        dest: "$SCRIPTS_PATH/vllm_run_for_d.sh"
        mode: '0750'
      vars:
        server_offset_dict: "{{ DECODE_SERVER_OFFSET }}"
      when: "'D' in group_names"
      tags:
        - run_server

    - name: Get socket name for communication between prefill instances and decode instances.
      shell: |
        ip -4 route list 0/0 | awk '{print $5}' | head -1
      register: default_interface_result
      changed_when: false
      tags:
        - run_server

    - name: Use a variable to store the socket name.
      set_fact:
        default_interface: "{{ default_interface_result.stdout }}"
      when: default_interface_result.stdout != ""
      tags:
        - run_server

    - name: Run the Omniai service for prefill instances.
      command: bash -c "{{ docker_start_vllm_cmd_p }}"
      environment:
        ROLE: "P"
        DOCKER_NAME_P: "{{ ACTUAL_DOCKER_NAME_P }}"
        NODE_PORT: "{{ node_port }}"
        PREFILL_SERVER_LIST: "{{ ascend_rt_visible_devices }}"
        API_PORT: "{{ api_port }}"
        SERVER_IP_LIST: "{{ DECODE_SERVER_IP_LIST | replace(' ', '') | trim }}"
        PREFILL_POD_NUM: "{{ PREFILL_POD_NUM }}"
        SOCKET_IFNAME: "{{ default_interface }}"
        IP: "{{ ansible_host }}"
        HOST_IP: "{{ host_ip }}"
        KV_RANK: "{{ kv_rank }}"
        NODE_RANK: "{{ node_rank }}"
        PREFILL_TENSOR_PARALLEL_SIZE: "{{ ascend_rt_visible_devices.split(',') | length }}"
        NNODES: "{{ NNODES }}"
        NODE_IP_LIST: "{{ NODE_IP_LIST }}"
        P_NODE_LIST: "{{ P_NODE_LIST }}"
        ENABLE_OMNI_CACHE_DSA_SPLIT: "{{ enable_omni_cache_dsa_split | default('1') }}"
        OMNI_CACHE_PREFILL_MMAP_FILE: "{{ omni_cache_prefill_mmap_file | default('omni_cache_p') }}"
        OMNI_CACHE_PREFILL_NUM_GPU_BLOCKS_OVERRIDE: "{{ omni_cache_prefill_num_gpu_blocks_override | default('47000') }}"
        MOONCAKE_CONFIG_PATH: "$SCRIPTS_PATH/mooncake_config.json"
        LMCACHE_MOONCAKE_CONFIG_PATH: "$SCRIPTS_PATH/lmcache_mooncake_config.yml"
      when: "'P' in group_names and (NODE_IP_LIST | string).split(',') | length >= 2"
      tags:
        - run_server

    - name: Wait 20 seconds.
      pause:
        seconds: 20  # Support decimals（such as 0.5s）
      when: "(NODE_IP_LIST | string).split(',') | length >= 2"
      tags:
        - proc_bind

    - name: Run the Omniai service for decode instances.
      command: bash -c "{{ docker_start_vllm_cmd_d }}"
      environment:
        ROLE: "D"
        DOCKER_NAME_D: "{{ ACTUAL_DOCKER_NAME_D }}"
        NODE_PORT: "{{ node_port }}"
        API_PORT: "{{ api_port }}"
        DECODE_SERVER_LIST: "{{ ascend_rt_visible_devices }}"
        SERVER_IP_LIST: "{{ DECODE_SERVER_IP_LIST | replace(' ', '') | trim }}"
        PREFILL_POD_NUM: "{{ PREFILL_POD_NUM }}"
        DECODE_POD_NUM: "{{ DECODE_POD_NUM }}"
        SOCKET_IFNAME: "{{ default_interface }}"
        NUM_SERVERS: "{{ ascend_rt_visible_devices.split(',') | length }}"
        HOST_IP: "{{ host_ip }}"
        DECODE_DATA_PARALLEL_SIZE: "{{ DECODE_SERVER_ALL }}"
        # DECODE_DATA_PARALLEL_SIZE: "0"
        HOST: "{{ inventory_hostname }}"
        P_NODE_LIST: "{{ P_NODE_LIST }}"
        OMNI_CACHE_DECODE_MMAP_FILE: "{{ omni_cache_decode_mmap_file | default('omni_cache_d') }}"
        OMNI_CACHE_DECODE_NUM_GPU_BLOCKS_OVERRIDE: "{{ omni_cache_decode_num_gpu_blocks_override | default('5000') }}"
        ENABLE_OMNI_CACHE_DSA_SPLIT: "{{ enable_omni_cache_dsa_split | default('0') }}"
        DISABLE_GATHER_SELECTION: "{{ disable_gather_selection | default('0') }}"
        OMNI_CACHE_DSA_MMAP_FILE: "{{ omni_cache_dsa_mmap_file | default('omni_cache_decode_dsa') }}"
        MOONCAKE_CONFIG_PATH: "$SCRIPTS_PATH/mooncake_config.json"
        LMCACHE_MOONCAKE_CONFIG_PATH: "$SCRIPTS_PATH/lmcache_mooncake_config.yml"
      when: "'D' in group_names"
      tags:
        - run_server

    # - name: Wait 45 seconds.
    #   pause:
    #     seconds: 45
    #   when: "(NODE_IP_LIST | string).split(',') | length == 1"
    #   tags:
    #     - run_server

    - name: Run the Omniai service for prefill instances.
      command: bash -c "{{ docker_start_vllm_cmd_p }}"
      environment:
        ROLE: "P"
        DOCKER_NAME_P: "{{ ACTUAL_DOCKER_NAME_P }}"
        NODE_PORT: "{{ node_port }}"
        PREFILL_SERVER_LIST: "{{ ascend_rt_visible_devices }}"
        API_PORT: "{{ api_port }}"
        SERVER_IP_LIST: "{{ DECODE_SERVER_IP_LIST | replace(' ', '') | trim }}"
        PREFILL_POD_NUM: "{{ PREFILL_POD_NUM }}"
        SOCKET_IFNAME: "{{ default_interface }}"
        IP: "{{ ansible_host }}"
        HOST_IP: "{{ host_ip }}"
        KV_RANK: "{{ kv_rank }}"
        NODE_RANK: "{{ node_rank }}"
        PREFILL_TENSOR_PARALLEL_SIZE: "{{ ascend_rt_visible_devices.split(',') | length }}"
        NNODES: "{{ NNODES }}"
        NODE_IP_LIST: "{{ NODE_IP_LIST }}"
        P_NODE_LIST: "{{ P_NODE_LIST }}"
        ENABLE_OMNI_CACHE_DSA_SPLIT: "{{ enable_omni_cache_dsa_split | default('1') }}"
        OMNI_CACHE_PREFILL_MMAP_FILE: "{{ omni_cache_prefill_mmap_file | default('omni_cache_p') }}"
        OMNI_CACHE_PREFILL_NUM_GPU_BLOCKS_OVERRIDE: "{{ omni_cache_prefill_num_gpu_blocks_override | default('297800') }}"
        MOONCAKE_CONFIG_PATH: "$SCRIPTS_PATH/mooncake_config.json"
        LMCACHE_MOONCAKE_CONFIG_PATH: "$SCRIPTS_PATH/lmcache_mooncake_config.yml"
      when: "'P' in group_names and (NODE_IP_LIST | string).split(',') | length == 1"
      tags:
        - run_server


    - name: Wait for vLLM service to be ready in container D
      ansible.builtin.shell:
        cmd: |
          timeout=300
          while [ $timeout -gt 0 ]; do
            if docker exec $DOCKER_NAME_D grep -q "Application startup complete" ${LOG_PATH}/{{ inventory_hostname }}/server_0.log; then
              echo "Service ready"
              exit 0
            fi
            sleep 20
            timeout=$((timeout - 20))
          done
          echo "Timeout waiting for service" >&2
          exit 1
      environment:
        DOCKER_NAME_D: "{{ ACTUAL_DOCKER_NAME_D }}"
        LOG_PATH: "{{ ansible_env.LOG_PATH }}"
      when:
        - "'D' in group_names"
        - "proc_bind_enabled | default(false)"
      tags:
        - proc_bind


    - name: Ensure bind_cpu.sh is executable in the container
      ansible.builtin.shell:
        cmd: docker exec $DOCKER_NAME_P chmod +x /workspace/omniinfer/tools/scripts/bind_cpu.sh
      environment:
        DOCKER_NAME_P: "{{ ACTUAL_DOCKER_NAME_P }}"
      when: "'P' in group_names"
      tags:
        - proc_bind

    - name: Ensure bind_cpu.sh is executable in the container
      ansible.builtin.shell:
        cmd: docker exec $DOCKER_NAME_D chmod +x /workspace/omniinfer/tools/scripts/bind_cpu.sh
      environment:
        DOCKER_NAME_D: "{{ ACTUAL_DOCKER_NAME_D }}"
      when: "'D' in group_names"
      tags:
        - proc_bind

    - name: Prefill cpu_pin
      command: /bin/bash -c "{{ docker_exec_cmd }} $DOCKER_NAME_P /bin/bash -c /workspace/omniinfer/tools/scripts/bind_cpu.sh"
      environment:
        DOCKER_NAME_P: "{{ ACTUAL_DOCKER_NAME_P }}"
        SCRIPTS_PATH: "{{ ansible_env.SCRIPTS_PATH }}"
        ROLE: "P"
      become: yes
      when:
        - "'P' in group_names"
        - "proc_bind_enabled | default(false)"
      tags:
        - proc_bind

    - name: Decode cpu_pin
      command: /bin/bash -c "{{ docker_exec_cmd }} $DOCKER_NAME_D /bin/bash -c /workspace/omniinfer/tools/scripts/bind_cpu.sh"
      environment:
        DOCKER_NAME_D: "{{ ACTUAL_DOCKER_NAME_D }}"
        SCRIPTS_PATH: "{{ ansible_env.SCRIPTS_PATH }}"
        ROLE: "D"
      become: yes
      when:
        - "'D' in group_names"
        - "proc_bind_enabled | default(false)"
      tags:
        - proc_bind

    - name: Generate a script to kill all nginx processes in the container.
      copy:
        content: "{{ kill_nginx_processes_cmd }}"
        dest: "$SCRIPTS_PATH/kill_nginx_processes.sh"
        mode: '0750'
      when: "'C' in group_names"
      tags: run_proxy

    - name: Kill all Python processes in the container of proxy.
      command: /bin/bash -c "{{ docker_exec_cmd }} $DOCKER_NAME_C /bin/bash -c $SCRIPTS_PATH/kill_nginx_processes.sh"
      environment:
        DOCKER_NAME_C: "{{ ACTUAL_DOCKER_NAME_C }}"
      failed_when: false
      no_log: true
      when: "'C' in group_names"
      tags: run_proxy

    - name: Generate a script to run the global proxy server.
      copy:
        content: "{{ run_proxy_cmd }}"
        dest: "$SCRIPTS_PATH/run_proxy_server.sh"
        mode: '0750'
      when: "'C' in group_names"
      tags:
        - run_proxy

    - name: Run the global proxy server.
      command: bash -c "{{ docker_start_proxy_cmd_c }}"
      environment:
        DOCKER_NAME_C: "{{ ACTUAL_DOCKER_NAME_C }}"
      when: "'C' in group_names"
      tags:
        - run_proxy

