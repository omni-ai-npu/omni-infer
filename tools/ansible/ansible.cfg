[defaults]
# playbooks/*.yml 经 import_role 引用本仓库 roles/ 下的角色。ansible 默认只在
# playbook 同级的 roles/（即 playbooks/roles/）查找，找不到；此处显式指向仓库根 roles/，
# 使 `ansible-playbook -i inventory.yml playbooks/Y.yml`（在 tools/ansible/ 下执行）
# 与 --syntax-check 均无需额外 ANSIBLE_ROLES_PATH 即可解析 role。
roles_path = roles
