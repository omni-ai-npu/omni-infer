all:
  children:
    C:
      hosts:
        c0:
          DOCKER_IMAGE_ID: image-repository:tag
          ansible_host: 127.0.0.1
          ansible_ssh_common_args: -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
          ansible_ssh_private_key_file: /path/to/key
          ansible_user: root
          args:
            decode-lb-sdk: least_conn
            prefill-lb-sdk: least_conn
            subrequest-output-buffer-size: 10M
          ascend_rt_visible_devices: 0,1,2,3,4,5,6,7
          container_name: minimax_2p1d_c0
          use_omni_proxy: true
          env:
            API_PORT: 7200
            CODE_PATH: /workspace/omniinfer
            LOG_PATH: /tmp/log_path
            ROLE: proxy
            MODEL_PATH: /data/models/minimax
    D:
      hosts:
        d0:
          DOCKER_IMAGE_ID: image-repository:tag
          ansible_host: 127.0.0.3
          ansible_ssh_common_args: -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
          ansible_ssh_private_key_file: /path/to/key
          ansible_user: root
          args:
            base-api-port: $API_PORT
            extra-args:
              enable-expert-parallel: ''
              disable-log-requests: ''
              no-enable-prefix-caching: ''
              max-num-seqs: 10
              distributed-executor-backend: mp
              compilation-config:
                level: 3
                cudagraph_mode: FULL_DECODE_ONLY
                cudagraph_capture_sizes: [10]
                backend: eager
                compile_sizes: [10]
            gpu-util: '0.95'
            kv-transfer-config:
              engine_id: "2"
              kv_buffer_device: npu
              kv_connector: LLMDataDistConnector
              kv_parallel_size: 8
              kv_rank: $KV_RANK
              kv_role: kv_consumer
            log-dir: $LOG_PATH
            master-ip: $HOST_IP
            master-port: $MASTER_PORT
            max-model-len: $MODEL_LEN_MAX_DECODE
            model-path: $MODEL_PATH
            num-dp: 1
            num-servers: 1
            served-model-name: minimax
            server-offset: $SERVER_OFFSET
            tp: 8
          ascend_rt_visible_devices: 0,1,2,3,4,5,6,7
          container_name: minimax_2p1d_d0
          env:
            OMNI_REUSE_PREFILLED_TOKENS: 1
            OMNI_SKIP_DECODE_TOKENIZE: 1
            VLLM_PLUGINS: omni-npu,omni_npu_patches,omni_custom_models
            VLLM_DISABLE_COMPILE_CACHE: 1
            OMNI_NPU_VLLM_PATCHES_ALL: 1
            ASCEND_PLATFORM: A2
            OMNI_NPU_VLLM_PATCHES: ALL
            API_PORT: 9100
            ASCEND_GLOBAL_LOG_LEVEL: 3
            HCCL_OP_EXPANSION_MODE: "AIV"
            ASCEND_AICPU_PATH: /usr/local/Ascend/latest
            ASCEND_HOME_PATH: /usr/local/Ascend/latest
            ASCEND_LAUNCH_BLOCKING: 0
            ASCEND_OPP_PATH: /usr/local/Ascend/latest/opp
            ASCEND_TOOLKIT_HOME: /usr/local/Ascend/latest
            AUTO_USE_UC_MEMORY: 1
            CODE_PATH: /workspace/omniinfer
            DECODE_POD_NUM: 1
            DECODE_SERVER_LIST: 0,1,2,3,4,5,6,7
            GLOBAL_DECODE_SERVER_IP_LIST: ${SERVER_IP_LIST}
            GLOBAL_RANK_TABLE_FILE_PATH: ${RANKTABLE_SAVE_PATH}/global/global_ranktable_merge.json
            GLOO_SOCKET_IFNAME: enp67s0f5
            HCCL_BUFFSIZE: 200
            HCCL_CONNECT_TIMEOUT: 1800
            HCCL_EXEC_TIMEOUT: 1800
            HCCL_INTRA_PCIE_ENABLE: 0
            HCCL_INTRA_ROCE_ENABLE: 1
            HOST_IP: 127.0.0.3
            KV_RANK: 2
            LCCL_DETERMINISTIC: 0
            LCCL_PARALLEL: 0
            LOCAL_DECODE_SERVER_IP_LIST: ${SERVER_IP_LIST}
            LOG_PATH: /tmp/log_path
            MASTER_PORT: 8000
            MODEL_LEN_MAX_DECODE: 196608
            MODEL_PATH: /data/models/minimax
            PREFILL_POD_NUM: 2
            PYTORCH_NPU_ALLOC_CONF: max_split_size_mb:256
            RANKTABLE_SAVE_PATH: /tmp/ranktable_save_path
            RANK_TABLE_FILE_PATH: $(ls ${RANKTABLE_SAVE_PATH}/decode_config/local_*.json)
            ROLE: decode
            SERVER_IP_LIST: 127.0.0.3
            SERVER_OFFSET: 0
            SHLVL: 1
            SOCKET_IFNAME: enp67s0f5
            TASK_QUEUE_ENABLE: 1
            TNG_HOST_COPY: 1
            TOOLCHAIN_HOME: /usr/local/Ascend/latest/toolkit
            TP_SOCKET_IFNAME: enp67s0f5
            USING_LCCL_COM: 0
            VLLM_LLMDATADIST_ZMQ_PORT: 5668
            VLLM_LOGGING_LEVEL: INFO
            VLLM_USE_V1: 1
            VLLM_WORKER_MULTIPROC_METHOD: fork
          host_ip: 127.0.0.3
          master_node: d0
    P:
      hosts:
        p0:
          DOCKER_IMAGE_ID: image-repository:tag
