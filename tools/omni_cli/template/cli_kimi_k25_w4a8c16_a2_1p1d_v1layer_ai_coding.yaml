            ASDSIP_LOG_PATH: /root
            ASDSIP_LOG_TO_BOOST_TYPE: asdsip
            ASDSIP_LOG_TO_FILE: 0
            ASDSIP_LOG_TO_FILE_FLUSH: 0
            ASDSIP_LOG_TO_STDOUT: 0
