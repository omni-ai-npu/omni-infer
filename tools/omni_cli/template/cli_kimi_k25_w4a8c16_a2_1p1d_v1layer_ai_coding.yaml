            base-api-port: $API_PORT
            extra-args:
              disable-log-requests: ''
              enable-expert-parallel: ''
              max-num-seqs: 2
              no-enable-prefix-caching: ''
              distributed-executor-backend: mp
              compilation-config:
                level: 3
                cudagraph_mode: FULL_DECODE_ONLY
                cudagraph_capture_sizes:
                - 2
                backend: eager
                compile_sizes:
                - 2
            gpu-util: '0.90'
            kv-transfer-config:
              engine_id: '1'
              kv_buffer_device: npu
              kv_connector: LLMDataDistConnector
              kv_parallel_size: 1
              kv_rank: $KV_RANK
              kv_role: kv_consumer
            log-dir: $LOG_PATH
            master-ip: $HOST_IP
            master-port: $MASTER_PORT
            max-model-len: $MODEL_LEN_MAX_DECODE
            model-path: $MODEL_PATH
            num-dp: 2
            num-servers: 1
            served-model-name: kimi_k25
            server-offset: $SERVER_OFFSET
            tp: 8
          ascend_rt_visible_devices: 0,1,2,3,4,5,6,7
          container_name: kimi_1p1d_d0
          env:
            API_PORT: 7917
            NUM_DIE_PER_MACH: 8
            ASCEND_AICPU_PATH: /usr/local/Ascend/latest
            ASCEND_HOME_PATH: /usr/local/Ascend/latest
            ASCEND_LAUNCH_BLOCKING: 0
            ASCEND_OPP_PATH: /usr/local/Ascend/latest/opp
            ASCEND_TOOLKIT_HOME: /usr/local/Ascend/latest
            ASCEND_GLOBAL_LOG_LEVEL: 3
            CPU_AFFINITY_CONF: 1,npu0:144-167,npu1:0-23,npu2:144-167,npu3:0-23,npu4:96-119,npu5:48-71,npu6:96-119,npu7:48-71
            ASDOPS_LOG_LEVEL: ERROR
            ASDOPS_LOG_PATH: /root
            ASDOPS_LOG_TO_BOOST_TYPE: atb
            ASDOPS_LOG_TO_FILE: 1
            ASDOPS_LOG_TO_FILE_FLUSH: 0
            ASDOPS_LOG_TO_STDOUT: 0
            ASDSIP_HOME_PATH: /usr/local/Ascend/nnal/asdsip/latest/
