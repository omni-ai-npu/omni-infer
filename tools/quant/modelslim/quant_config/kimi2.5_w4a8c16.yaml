apiversion: multimodal_vlm_modelslim_v1
metadata:
  config_id: kimi_w4a8_quarot
  score: 90
  verified_model_types:
    - Kimi-K2.5
  label:
    w_bit: 4
    a_bit: 8
    is_sparse: False
    kv_cache: False

default_w8a8_dynamic: &default_w8a8_dynamic
  act:
    scope: "per_token"
    dtype: "int8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_channel"
    dtype: "int8"
    symmetric: True
    method: "minmax"
default_w4a8_dynamic: &default_w4a8_dynamic
    act:
      scope: "per_token"
      dtype: "int8"
      symmetric: True
      method: "minmax"
    weight:
      scope: "per_channel"
      dtype: "int4"
      symmetric: True
      method: "ssz"
spec:
  process:
    # - type: "quarot"
    - type: "flex_smooth_quant"
      enable_subgraph_type:
        - 'norm-linear'
        - 'ov'
      include:
        - "*"
    - type: "group"
      configs:
        - type: "linear_quant"
          qconfig: *default_w8a8_dynamic
          include:
            - "*self_attn*"
          exclude:
            - "*kv_b_proj"
        - type: "linear_quant"
          qconfig: *default_w8a8_dynamic
          include:
            - "*mlp*"
          exclude:
            - "*gate"
            - "*mlp.experts.*"
            - "*vision_tower*"
        - type: "linear_quant"
          qconfig: *default_w4a8_dynamic
          include:
            - "*mlp.experts.*"
          exclude:
            - "*gate"
  dataset: calibImages
  save:
    - type: "ascendv1_saver"
      part_file_size: 4
      