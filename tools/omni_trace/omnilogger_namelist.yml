  - module: "vllm.v1.core.sched.scheduler:Scheduler"
    function_name: schedule
    entry_operation: |
      import os, time
      from omni_trace.utils import ip_str, safe_print, trace_output_directory
      
      # step: capture scheduler step start state for update_from_output.
      self._trace_engine_step_start_time = time.time()
      self._trace_start_free_block_num = self.kv_cache_manager.block_pool.get_num_free_blocks()
      
      class CustomList(list):
          def append(self, item):
              if os.getenv('ROLE') == "encode":
                  safe_print(trace_output_directory, f"<<<Action: Start append running sequence for encode; Timestamp:{time.time()}; RequestID:{item.request_id}; Role:{os.getenv('ROLE')}_{ip_str}")              
              elif os.getenv('ROLE') == "prefill":
                  safe_print(trace_output_directory, f"<<<Action: Start append running sequence for prefill; Timestamp:{time.time()}; RequestID:{item.request_id}; Role:{os.getenv('ROLE')}_{ip_str}")
              elif os.getenv('ROLE') == "decode":
                  safe_print(trace_output_directory, f"<<<Action: Start append running sequence for decode; Timestamp:{time.time()}; RequestID:{item.request_id}; Role:{os.getenv('ROLE')}_{ip_str}")
              super().append(item)
      self.running = CustomList(self.running)

      for request in self.waiting:
          if os.getenv('ROLE') == "encode":
              safe_print(trace_output_directory, f"<<<Action: Encoder try to schedule in waiting queue; Timestamp:{time.time()}; RequestID:{request.request_id}; Role:{os.getenv('ROLE')}_{ip_str}")
          elif os.getenv('ROLE') == "prefill":
              safe_print(trace_output_directory, f"<<<Action: Prefill try to schedule in waiting queue; Timestamp:{time.time()}; RequestID:{request.request_id}; Role:{os.getenv('ROLE')}_{ip_str}")
    exit_operation: |
      import os, time
      from omni_trace.utils import ip_str, safe_print, trace_output_directory

      # step: save start state on this SchedulerOutput for update_from_output.
      self.execute_model_start_time = time.time()       
      scheduler_output_schedule = result
      scheduler_output_schedule.engine_core_str = f'{os.getpid()}-{self.execute_model_start_time}'
      scheduler_output_schedule.engine_step_start_time = self._trace_engine_step_start_time
      scheduler_output_schedule.start_free_block_num = self._trace_start_free_block_num
      
      for req in scheduler_output_schedule.scheduled_new_reqs:
          if os.getenv('ROLE') == "encode":
              safe_print(trace_output_directory, f"<<<Action: Encoder start execute_model; Timestamp:{time.time()}; RequestID:{req.req_id}; Role:{os.getenv('ROLE')}_{ip_str}")
          elif os.getenv('ROLE') == "prefill":
              safe_print(trace_output_directory, f"<<<Action: Prefill start execute_model; Timestamp:{time.time()}; RequestID:{req.req_id}; Role:{os.getenv('ROLE')}_{ip_str}")
          elif os.getenv('ROLE') == "decode":
              safe_print(trace_output_directory, f"<<<Action: Start to send output; Timestamp:{time.time()}; RequestID:{req.req_id}; Role:{os.getenv('ROLE')}_{ip_str}")

  - module: "vllm.v1.worker.gpu_model_runner:GPUModelRunner"
    function_name: _update_states
    entry_operation: |
      import os, time
      from omni_trace.utils import ip_str, safe_print, trace_output_directory
      scheduler_output = args[0]
      for req in scheduler_output.scheduled_new_reqs:
          if os.getenv('ROLE') == "prefill":
              safe_print(trace_output_directory, f"<<<Action: Prefill start execute main model; Timestamp:{time.time()}; RequestID:{req.req_id}; Role:{os.getenv('ROLE')}_{ip_str}")
      # step
      scheduler_output.main_model_start_time = time.time()
    exit_operation: |
      ## Build mm_hash -> request_id map for start_load_caches trace
      import os
      from omni_trace.utils import trace_set_mm_hash_req_map
      if os.getenv('ROLE') == "prefill":
          scheduler_output = args[0]
          meta = scheduler_output.ec_connector_metadata
          load_hashes = set(meta.mm_hashes) if meta and hasattr(meta, "mm_hashes") else set()
          mapping = {}
          if load_hashes:
              for new_req in scheduler_output.scheduled_new_reqs:
                  for feature in new_req.mm_features or []:
                      if feature.identifier in load_hashes:
                          mapping[feature.identifier] = new_req.req_id
              for req_id in scheduler_output.num_scheduled_tokens.keys():
                  req = self.requests.get(req_id)
                  if req is None:
                      continue
                  for feature in req.mm_features or []:
                      if feature.identifier in load_hashes:
                          mapping[feature.identifier] = req_id
          trace_set_mm_hash_req_map(mapping)

