  - module: "vllm.v1.engine.core:EngineCoreProc"
    function_name: process_input_sockets
    entry_operation: |
      import os, time
      from omni_trace.utils import ip_str, safe_print, trace_output_directory
      from vllm.v1.engine import EngineCoreRequestType
      def patch_queue_put_nowait(queue):
          original_put_nowait = queue.put_nowait
          def patched_put_nowait(item):
              request_type, request = item
              if request_type == EngineCoreRequestType.ADD:
                  req, request_wave = request  
                  request_id = req.request_id  
                  if os.getenv('ROLE') == "encode":
                      safe_print(trace_output_directory, f"<<<Action: Start process request in encode engine; Timestamp:{time.time()}; RequestID:{request_id}; Role:{os.getenv('ROLE')}_{ip_str}")
                  elif os.getenv('ROLE') == "prefill":
                      safe_print(trace_output_directory, f"<<<Action: Start process request in prefill engine; Timestamp:{time.time()}; RequestID:{request_id}; Role:{os.getenv('ROLE')}_{ip_str}")
                  elif os.getenv('ROLE') == "decode":
                      safe_print(trace_output_directory, f"<<<Action: Start to dispatch decode request; Timestamp:{time.time()}; RequestID:{request_id}; Role:{os.getenv('ROLE')}_{ip_str}")
              original_put_nowait(item)
          queue.put_nowait = patched_put_nowait
          return queue
      self.input_queue = patch_queue_put_nowait(self.input_queue)

