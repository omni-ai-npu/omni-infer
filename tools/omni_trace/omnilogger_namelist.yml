  - module: "vllm.v1.worker.gpu_model_runner:GPUModelRunner"
    function_name: _execute_mm_encoder
    entry_operation: |
      import os, time
      from omni_trace.utils import ip_str, safe_print, trace_output_directory, trace_set_mm_hash_req_map
      
      ## Build mm_hash -> request_id map for save_caches trace
      scheduler_output = args[0]
      mapping = {}
      for req_id, input_ids in scheduler_output.scheduled_encoder_inputs.items():
          req = self.requests.get(req_id)
          if req is None:
              continue
          for mm_input_id in input_ids:
              feature = req.mm_features[mm_input_id]
              mapping[feature.identifier] = req_id
      trace_set_mm_hash_req_map(mapping)

      self._trace_mm_execute_request_ids = list(scheduler_output.scheduled_encoder_inputs.keys())
      for req_id in self._trace_mm_execute_request_ids:
          if os.getenv('ROLE') == "encode":
              safe_print(trace_output_directory, f"<<<Action: Encoder start _execute_mm_encoder; Timestamp:{time.time()}; RequestID:{req_id}; Role:{os.getenv('ROLE')}_{ip_str}")
          elif os.getenv('ROLE') == "prefill":
              safe_print(trace_output_directory, f"<<<Action: Prefill start _execute_mm_encoder; Timestamp:{time.time()}; RequestID:{req_id}; Role:{os.getenv('ROLE')}_{ip_str}")
    exit_operation: |
      import os, time
      from omni_trace.utils import ip_str, safe_print, trace_output_directory, trace_clear_mm_hash_req_map
      for request_id in self._trace_mm_execute_request_ids:
          if os.getenv('ROLE') == "encode":
              safe_print(trace_output_directory, f"<<<Action: Encoder done _execute_mm_encoder; Timestamp:{time.time()}; RequestID:{request_id}; Role:{os.getenv('ROLE')}_{ip_str}")
          elif os.getenv('ROLE') == "prefill":
              safe_print(trace_output_directory, f"<<<Action: Prefill done _execute_mm_encoder; Timestamp:{time.time()}; RequestID:{request_id}; Role:{os.getenv('ROLE')}_{ip_str}")

      ## Clear mm_hash -> request_id map for save_caches trace
      trace_clear_mm_hash_req_map()

