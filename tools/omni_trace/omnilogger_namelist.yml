  - module: "vllm.v1.worker.gpu_model_runner:GPUModelRunner"
    function_name: execute_model
    exit_operation: |
      import os, time
      from omni_trace.utils import ip_str, safe_print, trace_output_directory, trace_clear_mm_hash_req_map
      scheduler_output = args[0]
      for req in scheduler_output.scheduled_new_reqs:
          if os.getenv('ROLE') == "prefill":
              safe_print(trace_output_directory, f"<<<Action: Prefill done execute main model; Timestamp:{time.time()}; RequestID:{req.req_id}; Role:{os.getenv('ROLE')}_{ip_str}")
      for req_id in scheduler_output.num_scheduled_tokens.keys():
          if os.getenv('ROLE') == "encode":
              safe_print(trace_output_directory, f"<<<Action: Encoder done execute_model; Timestamp:{time.time()}; RequestID:{req_id}; Role:{os.getenv('ROLE')}_{ip_str}")

      # step
      if scheduler_output.total_num_scheduled_tokens != 0 and os.getenv('ROLE') != "prefill": 
          main_model_end_time = time.time()
          execute_model_cost_time = (main_model_end_time - scheduler_output.main_model_start_time) * 1000
          engine_core_str = scheduler_output.engine_core_str
          safe_print(trace_output_directory, f"profile_mainmodel: {os.getenv('ROLE')}_{ip_str}|{scheduler_output.main_model_start_time}|"
              f"{main_model_end_time}|{execute_model_cost_time}|{engine_core_str}"
          )

      ## Clear mm_hash -> request_id map for start_load_caches trace
      trace_clear_mm_hash_req_map()

