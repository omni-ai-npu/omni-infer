  - module: "vllm.v1.core.sched.scheduler:Scheduler"
    function_name: update_from_output
    entry_operation: |
      import os, time
      from omni_trace.utils import ip_str, safe_print, trace_output_directory
      scheduler_output = args[0]
      self.execute_model_end_time = time.time()
      if os.getenv('ROLE') == "prefill":
          for req_id in scheduler_output.num_scheduled_tokens.keys():
              safe_print(trace_output_directory, f"<<<Action: Prefill done execute_model; Timestamp:{time.time()}; RequestID:{req_id}; Role:{os.getenv('ROLE')}_{ip_str}")
    exit_operation: |
      # step end
      import os, time
      from omni_trace.utils import ip_str, safe_print, trace_output_directory
      scheduler_output = args[0]
      if scheduler_output.total_num_scheduled_tokens != 0:
          engine_step_finish_time = time.time()
          engine_step_start_time = scheduler_output.engine_step_start_time
          start_free_block_num = scheduler_output.start_free_block_num
          engine_step_execute_cost = (engine_step_finish_time - engine_step_start_time) * 1000
          execute_model_start_time = float(scheduler_output.engine_core_str.split("-", 1)[1])
          execute_model_cost_time = (self.execute_model_end_time - execute_model_start_time) * 1000
          waiting_reqs_num_after_step = len(self.waiting)
          running_reqs_num_after_step = len(scheduler_output.scheduled_new_reqs) + scheduler_output.scheduled_cached_reqs.num_reqs
          total_tokens = scheduler_output.total_num_scheduled_tokens
          reqs_ids = []
          bs_tokens = []
          if os.getenv("ROLE") == "prefill":
              for req_id, num_scheduled_token in scheduler_output.num_scheduled_tokens.items():
                  reqs_ids.append(req_id)
                  bs_tokens.append(num_scheduled_token)
          elif os.getenv("ROLE") == "decode":
              for req in scheduler_output.scheduled_new_reqs:
                  total_tokens += req.num_computed_tokens
              for computed_tokens in scheduler_output.scheduled_cached_reqs.num_computed_tokens:
                  total_tokens += computed_tokens
          kv_blocks_num = self.kv_cache_config.num_blocks
          end_free_block_num = self.kv_cache_manager.block_pool.get_num_free_blocks()
          cost_blocks_num = start_free_block_num - end_free_block_num

          engine_core_str = scheduler_output.engine_core_str
          engine_outputs_dict = result
          engine_core_outputs = engine_outputs_dict[0]  
          kv_cache_usage = engine_core_outputs.scheduler_stats.kv_cache_usage 
          safe_print(
              trace_output_directory,
              f"profile: {os.getenv('ROLE')}_{ip_str}|{engine_step_start_time}|"
              f"{engine_step_finish_time}|{engine_step_execute_cost}|"
              f"{running_reqs_num_after_step}|{total_tokens}|"
              f"{waiting_reqs_num_after_step}|{reqs_ids}|{bs_tokens}|"
              f"{execute_model_start_time}|{self.execute_model_end_time}|"
              f"{execute_model_cost_time}|{kv_cache_usage}|{kv_blocks_num}|"
              f"{start_free_block_num}|{end_free_block_num}|"
              f"{cost_blocks_num}|{engine_core_str}",
          )

  - module: "vllm.v1.engine.core:EngineCoreProc"
    function_name: process_output_sockets
    entry_operation: |
      import os, time
      import queue
      from omni_trace.utils import ip_str, safe_print, trace_output_directory
      def patch_queue_get(queue):
          original_get = queue.get
          def patch_get():
              value = original_get()      
              if isinstance(value, bytes):
                  return value
              client_index, engine_core_outputs = value
              for request in getattr(engine_core_outputs, 'outputs', []):
                  if os.getenv('ROLE') == "prefill":
                      safe_print(trace_output_directory, f"<<<Action: Start to send output in prefill stage; Timestamp:{time.time()}; RequestID:{request.request_id}; Role:{os.getenv('ROLE')}_{ip_str}")
              return value     
          queue.get = patch_get
          return queue
      self.output_queue = patch_queue_get(self.output_queue)

