# Single-node 1P1D template for a 16-NPU host. Replace single_node_ip and the
# SSH key path before deployment. Adjust both device lists together when the
# host has a different number of NPUs; P and D must not overlap.
all:
  vars:
    ansible_user: root
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o IdentitiesOnly=yes'
    ansible_ssh_private_key_file: /path/to/key.pem
    single_node_ip: "127.0.0.1"
    global_port_base: 8000
    base_api_port: 9000
    proxy_port: 7000
    port_offset:
      P: 0
      D: 100

  children:
    P:
      hosts:
        p0:
          ansible_host: "{{ single_node_ip }}"
          host_ip: "{{ single_node_ip }}"
          node_rank: 0
          kv_rank: 0
          node_port: "{{ global_port_base + port_offset.P + kv_rank }}"
          api_port: "{{ base_api_port + port_offset.P + kv_rank }}"
          ascend_rt_visible_devices: "0,1,2,3,4,5,6,7"

    D:
      hosts:
        d0:
          ansible_host: "{{ single_node_ip }}"
          host_ip: "{{ single_node_ip }}"
          node_rank: 0
          node_port: "{{ global_port_base + port_offset.D }}"
          api_port: "{{ base_api_port + port_offset.D + node_rank }}"
          ascend_rt_visible_devices: "8,9,10,11,12,13,14,15"

    C:
      hosts:
        c0:
          ansible_host: "{{ single_node_ip }}"
          host_ip: "{{ single_node_ip }}"
          node_rank: 0
          node_port: "{{ proxy_port + node_rank }}"
