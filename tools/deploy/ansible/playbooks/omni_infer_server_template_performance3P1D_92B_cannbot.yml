#
# 92B BF16 3P1D — vLLM 0.25.1 (A3)
# 参数对齐 A2: omni_infer_server_template_performance3P1D_92B_open_A2.yml
# 保留 A3 差异: 镜像/路径、pd_run.sh、OMNI_* 环境名、16 卡 LOCAL_WORLD_SIZE、kv_offload
# Inventory: omni_infer_inventory_used_for_3P8_1D8.yml
---
- name: Run PanguV2 92B BF16 3P1D Prefill, Decode, and Omni Proxy (vllm 0.25.1, A2-aligned).
  hosts: all
  any_errors_fatal: true
  max_fail_percentage: 0
  gather_facts: true
  environment:
    LOG_PATH: /data/log_path
    LOG_PATH_IN_EXECUTOR: /data/log_path_in_executor
    CODE_PATH: /data/local_code_path
    DOCKER_IMAGE_ID: "registry-cbu.huawei.com/omniai_omniinfer_dev/ai-infra-infer-1.0.3-a3-arm-feature/vllm_0.25.1-202609011510-daily:0.0.1"
    DOCKER_NAME_P: "docker_name_p"
    DOCKER_NAME_D: "docker_name_d"
    DOCKER_NAME_C: "docker_name_c"
    SCRIPTS_PATH: /tmp/scripts_path

  vars:
    model: pangu-v2-92b
    model_path: "/mnt/sfs_turbo/bucket-pangu-green-guiyang/openPangu_2.0_Flash_BF16/global_step_26/"
    enable_prefix_caching: true

    run_docker_profile:
      envs:
        - PYTHONHASHSEED=1234
      extra_mounts:
        - /mnt:/mnt
        - /tmp:/tmp
        - /home:/home

    # 代码直接用镜像内置
    sync_code_profile:
      host_sync:
        enabled: false
      container_copy:
        prefill: null
        decode: null
        proxy: null

    pip_install_profile: {}

    # --- Prefill：对齐 A2 ---
    # max-model-len 524288, batched 32768, max-num-seqs 12, GPU_UTIL 0.9,
    # MTP 3, enforce-eager, TASK_QUEUE_ENABLE=2
    run_server_prefill_profile:
      runner: pd_run.sh
      workdir: "{{ container_workspace }}/omniinfer/tools/deploy/start_server"
      kv_offload:
        enable: true
        hugepage_enabled: true
        cpu_bytes_to_use: 858993459200  # 800 GiB
      prepare_commands: |-
        for f in /usr/local/Ascend/ascend-toolkit/vendors/*/bin/set_env.bash; do
          [ -f "$f" ] && . "$f"
        done
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_ALL | replace(' ', '') | trim | quote }}
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=100
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_EXEC_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AIV"
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export TASK_QUEUE_ENABLE=2
        export OMNI_REUSE_PREFILLED_TOKENS=1
        export OMNI_SKIP_DECODE_TOKENIZE=1
        export VLLM_MQ_MAX_CHUNK_BYTES_MB=100
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        # 92B 用 17；505B 才是 18
        export OMNI_HYBRID_ATTN_GROUP_SIZE=17
        export OMNI_VLLM_PATCHES_DIR="pangu_v2_hybrid, pangu_v2_moe"
        export OMNI_VLLM_PATCHES="ALL"
        # A2: batched 32768 / seqs 12 / APC / eager
        EXTRA_ARGS="${EXTRA_ARGS} --no-disable-hybrid-kv-cache-manager --max-num-batched-tokens 32768"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-expert-parallel --max-num-seqs 12"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prompt-tokens-details --enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --dtype bfloat16 --enforce-eager"
        # EXTRA_ARGS="${EXTRA_ARGS} --kv-cache-dtype li_int8_ds_mla"
        # EXTRA_ARGS="${EXTRA_ARGS} --enable-logging-iteration-details"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu --enable-auto-tool-choice --tool-call-parser pangu"
        export OMNI_PANGU_TOOL_CALL_ENDS_THINKING=1
        REASONING_CONFIG='{"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-config ${REASONING_CONFIG}"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-lopt --lopt-pool-size 16 --lopt-chunk-size 4096"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_92B_xp1d_p_open.json"
        {% if enable_prefix_caching | bool %}
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prefix-caching --mamba-block-size 128"
        {% else %}
        EXTRA_ARGS="${EXTRA_ARGS} --no-enable-prefix-caching"
        {% endif %}
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        GPU_UTIL=0.92
      args:
        - --max-model-len 524288
        - '--additional-config ''{"enable_low_latency": true}'''
        - --gpu-util "${GPU_UTIL}"
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 3

    # --- Decode：最大图档位 [32] + GPU_UTIL 0.85 + kv_offload ---
    # max-model-len 524288, seqs 8 (=32/(1+MTP3)), batched 2048,
    # cudagraph FULL [32], npugraph_ex, MTP 3；A3 保持 LOCAL_WORLD_SIZE=16
    run_server_decode_profile:
      runner: pd_run.sh
      workdir: "{{ container_workspace }}/omniinfer/tools/deploy/start_server"
      kv_offload:
        enable: true
        hugepage_enabled: true
        cpu_bytes_to_use: 53687091200  # 50 GiB per Decode server
      prepare_commands: |-
        # NFS 权重加载远超 5min；提高 EngineCore handshake 超时
        sed -i 's/HANDSHAKE_TIMEOUT_MINS = 5/HANDSHAKE_TIMEOUT_MINS = 60/' /opt/vllm/vllm/v1/engine/core.py || true
        for f in /usr/local/Ascend/ascend-toolkit/vendors/*/bin/set_env.bash; do
          [ -f "$f" ] && . "$f"
        done
        export DECODE_DATA_PARALLEL_SIZE={{ DECODE_SERVER_BY_GROUP | quote }}
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_BY_GROUP | replace(' ', '') | trim | quote }}
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=1200
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_EXEC_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AI_CPU"
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export ASCEND_SLOG_PRINT_TO_STDOUT=0
        export ASCEND_GLOBAL_EVENT_ENABLE=0
        export OMNI_REUSE_PREFILLED_TOKENS=1
        export OMNI_SKIP_DECODE_TOKENIZE=1
        export VLLM_MQ_MAX_CHUNK_BYTES_MB=100
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=17
        export OMNI_VLLM_PATCHES_DIR="pangu_v2_hybrid, pangu_v2_moe"
        export OMNI_VLLM_PATCHES="ALL"
        export ENABLE_DP_LB=false
        export VLLM_DATA_PARALLEL_EXTERNAL_LB=false
        export VLLM_CACHE_ROOT='./graph_cache'
        export TASK_QUEUE_ENABLE=1
        # A3 单机 16 卡；A2 原配置 LOCAL_WORLD_SIZE=8
        export LOCAL_WORLD_SIZE=16
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        rm -rf ./graph_cache /workspace/omniinfer/tools/deploy/start_server/static_kernel_compile_outputs 2>/dev/null || true
        EXTRA_ARGS="${EXTRA_ARGS} --no-disable-hybrid-kv-cache-manager --enable-expert-parallel"
        # seqs=8 对齐最大图档 32=8*(1+MTP3)
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-seqs 8 --max-num-batched-tokens 2048"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prompt-tokens-details --enable-chunked-prefill"
        # 开启入图：最大档位 capture/compile size=32
        EXTRA_ARGS="${EXTRA_ARGS} --distributed-executor-backend mp --dtype bfloat16"
        # EXTRA_ARGS="${EXTRA_ARGS} --kv-cache-dtype li_int8_ds_mla"
        # EXTRA_ARGS="${EXTRA_ARGS} --enable-logging-iteration-details"
        COMPILATION_CONFIG='{"mode": 3, "cudagraph_mode":"FULL", "cudagraph_capture_sizes":[32], "backend":"", "compile_sizes":[32]}'
        EXTRA_ARGS="${EXTRA_ARGS} --compilation-config ${COMPILATION_CONFIG}"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu --enable-auto-tool-choice --tool-call-parser pangu"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-lopt --lopt-pool-size 16 --lopt-chunk-size 4096"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_92B_xp1d_d_open.json"
        export OMNI_PANGU_TOOL_CALL_ENDS_THINKING=1
        REASONING_CONFIG='{"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-config ${REASONING_CONFIG}"
        {% if enable_prefix_caching | bool %}
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prefix-caching --mamba-block-size 128"
        {% else %}
        EXTRA_ARGS="${EXTRA_ARGS} --no-enable-prefix-caching"
        {% endif %}
        export VLLM_DISABLE_COMPILE_CACHE=1
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        GPU_UTIL=0.85
      args:
        - --max-model-len 524288
        - --tp 1
        - >-
          --additional-config
          '{"enable_low_latency": true,
          "npugraph_ex_config":{"enable": true,
          "super_kernel_optimize": false,
          "static_kernel_compile": false}}'
        - --gpu-util "${GPU_UTIL}"
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 3

    run_server_common_profile:
      kv_connector: LLMDataDistConnector
      restart_proxy: true

    # --- Proxy：对齐 A2 ---
    run_proxy_profile:
      prepare_commands: |-
        export PYTHONHASHSEED=1234
        export TORCH_DEVICE_BACKEND_AUTOLOAD=0
      args:
        - --log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_error.log
        - --log-level info
        - --access-log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_access.log
        - --core-num 4
        - --start-core-index 16
        - --subrequest-output-buffer-size 10M
        - --omni-proxy-pd-policy sequential
        # 多轮交付摸底：header_affinity + X-Session-Id（客户端 ENABLE_SESSION_AFFINITY=1）
        - --omni-proxy-schedule-algo header_affinity
        - --omni-proxy-affinity-header X-Session-Id
        - --omni-proxy-max-batch-num-token 300000
        - --omni-proxy-prefill-max-num-seqs 12
        - --omni-proxy-decode-max-num-seqs 8

  tasks:
    - ansible.builtin.import_role:
        name: elastic_server
