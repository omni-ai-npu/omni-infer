---
- name: Run Pangu 92B Prefill, Decode, and Omni Proxy services.
  hosts: all
  any_errors_fatal: true
  max_fail_percentage: 0
  gather_facts: true
  environment:
    LOG_PATH: /data/log_path
    LOG_PATH_IN_EXECUTOR: /data/log_path_in_executor
    CODE_PATH: /data/local_code_path
    DOCKER_IMAGE_ID: "registry-cbu.huawei.com/omniai_omniinfer_dev/ai-infra-infer-1.0.3-a3-arm-develop-202609050943-daily:0.0.1"
    DOCKER_NAME_P: "docker_name_p"
    DOCKER_NAME_D: "docker_name_d"
    DOCKER_NAME_C: "docker_name_c"
    SCRIPTS_PATH: /tmp/scripts_path

  vars:
    model: pangu-v2-92b
    model_path: "/mnt/sfs_turbo/bucket-910c-6055/f00937498/global_step_26"

    run_docker_profile:
      envs:
        - PYTHONHASHSEED=123
      extra_mounts:
        - /data:/data
        - /mnt:/mnt
        - /tmp:/tmp
        - /home:/home

    sync_code_profile:
      container_copy:
        prefill: >-
          docker exec "$DOCKER_NAME_P" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_P" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_P}:{{ container_workspace }}/omniinfer/"
        decode: >-
          docker exec "$DOCKER_NAME_D" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_D" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_D}:{{ container_workspace }}/omniinfer/"

    run_server_prefill_profile:
      prepare_commands: |-
        ###################### PD / network ########################
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_ALL | replace(' ', '') | trim | quote }}
        export HCCL_SOCKET_IFNAME="${SOCKET_IFNAME}"
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=300
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_EXEC_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AI_CPU"
        export HCCL_DETERMINISTIC=STRICT
        export VLLM_ENABLE_MC2=1


        ###################### NPU runtime ########################
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        export TASK_QUEUE_ENABLE=1
        export ASCEND_SLOG_PRINT_TO_STDOUT=0
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export ASCEND_GLOBAL_EVENT_ENABLE=0
        export ASCEND_PROCESS_LOG_PATH="${LOG_PATH}/{{ inventory_hostname }}/plog"
        export CLOSE_MATMUL_K_SHIFT=1
        export NPU_TOP_K_TOP_P_SAMPLE_NOT_SUPPORT_FLOAT=1
        rm -rf "${ASCEND_PROCESS_LOG_PATH}"
        mkdir -p "${ASCEND_PROCESS_LOG_PATH}"


        ###################### vLLM / model ########################
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_VLLM_PATCHES_DIR="high_throughout"
        export OMNI_VLLM_PATCHES="ALL"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=17
        export OMNI_PANGU_V2_HIGH_THROUGHOUT=1
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="high_throughout/openpangu_v2/openpangu_v2_92b_bf16_a3_1p1d_precision_consistency_p.json"

        EXTRA_ARGS="--no-disable-hybrid-kv-cache-manager --max-num-seqs 8 --max-num-batched-tokens 16384"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prefix-caching --block-size 128 --mamba-block-size 128"
        EXTRA_ARGS="${EXTRA_ARGS} --enforce-eager --enable-expert-parallel --dtype bfloat16"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu --enable-auto-tool-choice --tool-call-parser pangu"
        GPU_UTIL=0.85
      args:
        - --max-model-len 524288
        - --gpu-util "${GPU_UTIL}"
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 3

    run_server_decode_profile:
      prepare_commands: |-
        ###################### PD / topology ########################
        export DECODE_DATA_PARALLEL_SIZE={{ DECODE_SERVER_BY_GROUP | quote }}
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_BY_GROUP | replace(' ', '') | trim | quote }}


        ###################### HCCL / network ########################
        export HCCL_SOCKET_IFNAME="${SOCKET_IFNAME}"
        export HCCL_BUFFSIZE=300
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_EXEC_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AI_CPU"
        export HCCL_DETERMINISTIC=STRICT
        export VLLM_DISABLE_PYNCCL=1
        export VLLM_ENABLE_MC2=1


        ###################### NPU runtime ########################
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        export TASK_QUEUE_ENABLE=1
        export ASCEND_SLOG_PRINT_TO_STDOUT=0
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export ASCEND_GLOBAL_EVENT_ENABLE=0
        export ASCEND_PROCESS_LOG_PATH="${LOG_PATH}/{{ inventory_hostname }}/plog"
        export CLOSE_MATMUL_K_SHIFT=1
        export NPU_TOP_K_TOP_P_SAMPLE_NOT_SUPPORT_FLOAT=1
        rm -rf "${ASCEND_PROCESS_LOG_PATH}"
        mkdir -p "${ASCEND_PROCESS_LOG_PATH}"


        ###################### vLLM / model ########################
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_VLLM_PATCHES_DIR="high_throughout"
        export OMNI_VLLM_PATCHES="ALL"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=17
        export OMNI_PANGU_V2_HIGH_THROUGHOUT=1
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="high_throughout/openpangu_v2/openpangu_v2_92b_bf16_a3_1p1d_precision_consistency_d.json"

        EXTRA_ARGS="--no-disable-hybrid-kv-cache-manager --enable-expert-parallel"
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-seqs 12 --max-num-batched-tokens 48"
        EXTRA_ARGS="${EXTRA_ARGS} --block-size 128 --mamba-block-size 128"
        EXTRA_ARGS="${EXTRA_ARGS} --distributed-executor-backend mp --enable-prefix-caching --dtype bfloat16"
        COMPILATION_CONFIG='{"mode": 3, "cudagraph_mode":"FULL", "cudagraph_capture_sizes":[4,24,48], "backend":"eager", "compile_sizes":[4,24,48]}'
        EXTRA_ARGS="${EXTRA_ARGS} --compilation-config ${COMPILATION_CONFIG}"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu --enable-auto-tool-choice --tool-call-parser pangu"
        GPU_UTIL=0.85
      args:
        - --max-model-len 524288
        - --tp 1
        - --gpu-util "${GPU_UTIL}"
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 3

    run_server_common_profile:
      single_node_prefill_wait_seconds: 5
      restart_proxy: true

    run_proxy_profile:
      prepare_commands: |-
        ###################### seed / torch ########################
        export PYTHONHASHSEED=123
        export TORCH_DEVICE_BACKEND_AUTOLOAD=0
      args:
        - --log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_error.log
        - --log-level notice
        - --access-log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_access.log
        - --core-num 4
        - --start-core-index 16
        - --subrequest-output-buffer-size 10M
        - --omni-proxy-pd-policy sequential
        - --omni-proxy-max-batch-num-token 100000
        - --omni-proxy-prefill-max-num-seqs 8
        - --omni-proxy-decode-max-num-seqs 12

  tasks:
    - ansible.builtin.import_role:
        name: elastic_server
