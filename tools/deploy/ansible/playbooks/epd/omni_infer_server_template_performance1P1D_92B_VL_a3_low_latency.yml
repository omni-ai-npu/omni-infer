---
# Model and performance parameters are aligned with:
#   components/omni-models/tools/scripts/openpangu_v2/openpangu_v2_92B_VL/
#   openpangu_v2_92B_VL_a3_server_template_for_1P1D_low_latency.yml
#
# Deployment orchestration and runner paths follow the current OmniInfer tree:
#   tools/deploy/ansible/roles/epd_server
#   tools/deploy/start_server/pd_run.sh
#
# Replace the environment-specific paths, image, and container names before use.
- name: Run PanguV2 92B VL 1P1D low-latency EPD services.
  hosts: all
  any_errors_fatal: true
  max_fail_percentage: 0
  gather_facts: true

  environment:
    LOG_PATH: /data/log_path
    LOG_PATH_IN_EXECUTOR: /data/log_path_in_executor
    CODE_PATH: /data/local_code_path
    DOCKER_IMAGE_ID: "registry-cbu.huawei.com/omniai_omniinfer_dev/ai-infra-infer-1.0.3-a3-arm-develop-202609050943-daily:0.0.1"

    DOCKER_NAME_E: "docker_name_e"
    DOCKER_NAME_P: "docker_name_p"
    DOCKER_NAME_D: "docker_name_d"
    DOCKER_NAME_C: "docker_name_c"
    SCRIPTS_PATH: /tmp/scripts_path

  vars:
    model: pangu-v2-92b-vl
    model_path: "/mnt/sfs_turbo/bucket-910c-6055/x30068536/Infer_Model/92B_VL_DSA/iter_0001378/"

    epd_profile:
      # true：启用独立 Encoder 进程；false：由 Prefill 完成编码，退化为 PD 部署。
      enabled: true
      # SharedMemConnector：E/P 共用 P 容器和设备，EC 走共享内存，E 使用 P 的 e_api_port。
      # NetworkConnector：E 使用独立 E 组和容器，EC 走网络，E 配置 api_port 和 ec_port。
      connector_type: SharedMemConnector
      # 其余可选项及 role 默认值：
      # ec_cache_max_gb: 50  # Encoder 输出缓存容量，单位 GiB。
      # load_ec_async: true  # Network 模式并发拉取 EC 缓存。
      # mm_feature_transfer_port: 5555  # MM 网络接收端口，也可在 inventory 按主机覆盖。
      # mm_feature_storage_root: /tmp/omni_epd_mm_features  # MM 落盘根目录，下分 inventory 主机名。

    run_docker_profile:
      shm_size: 1000g
      envs:
        - PYTHONHASHSEED=1234
      extra_mounts:
        - /mnt:/mnt
        - /tmp:/tmp
        - /home:/home

    # Keep the components already present in the image/container and overlay
    # the current OmniInfer source. This avoids the obsolete
    # components/omni-eplb/build/build.sh path in the archived deployment.
    sync_code_profile:
      container_copy:
        prefill: >-
          docker exec "$DOCKER_NAME_P" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_P" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_P}:{{ container_workspace }}/omniinfer/"
        decode: >-
          docker exec "$DOCKER_NAME_D" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_D" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_D}:{{ container_workspace }}/omniinfer/"

        # Network mode only. SharedMem mode reuses the Prefill container.
        encode: >-
          docker exec "$DOCKER_NAME_E" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_E" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_E}:{{ container_workspace }}/omniinfer/"

    # E 的 EC/MM producer 配置由 role 生成并传给启动模板，此处配置 Encoder 服务参数。
    run_server_encode_profile:
      docker_envs:
        VLLM_DISABLE_PYNCCL: "1"
        VLLM_PLUGINS: "omni-npu,omni_npu_patches,omni_pangu_models,omni_custom_models"
        OMNI_VLLM_PATCHES_DIR: "pangu_v2_hybrid,pangu_v2_moe,openpangu_v1_vl"
        OMNI_VLLM_PATCHES: "ALL"
        VLLM_VIDEO_LOADER_BACKEND: npu_opencv_dynamic
        USING_SAMPLING_TENSOR_CACHE: "1"
        USING_LCCL_COM: "1"
        CPU_AFFINITY_CONF: "1"
        VLLM_WORKER_MULTIPROC_METHOD: "spawn"
        OMP_NUM_THREADS: "64"
        RL_SERVICE_MODE: "1"
        ASCEND_LAUNCH_BLOCKING: "0"
        ASCEND_GLOBAL_LOG_LEVEL: "3"
        VLLM_ENABLE_SLEEP_MODE: "1"
        VLLM_DISABLE_COMPILE_CACHE: "1"
        VLLM_SERVER_DEV_MODE: "1"
        VLLM_ENABLE_GRAPH_MODE: "1"
        HCCL_OP_EXPANSION_MODE: "{{ 'AIV' if (epd_profile.connector_type | default('SharedMemConnector')) == 'NetworkConnector' else 'AI_CPU' }}"
        HCCL_BUFFSIZE: "500"
        HCCL_CONNECT_TIMEOUT: "1800"
        HCCL_EXEC_TIMEOUT: "1800"
        HCCL_NPU_SOCKET_PORT_RANGE: "61000-61050"
        TASK_QUEUE_ENABLE: "1"
        PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
        VLLM_MQ_MAX_CHUNK_BYTES_MB: "100"
        OMNI_REUSE_PREFILLED_TOKENS: "1"
        OMNI_SKIP_DECODE_TOKENIZE: "1"
        VLLM_OBJECT_STORAGE_SHM_BUFFER_NAME: "ENCODE_SHM_BUFFER"

      prepare_commands: |-
        source /usr/local/Ascend/ascend-toolkit/set_env.sh
        # source /usr/local/Ascend/ascend-toolkit/vendors/omni_custom_ops/bin/set_env.bash
        # source /usr/local/Ascend/ascend-toolkit/vendors/omni_training_custom_ops/bin/set_env.bash

        export GLOO_SOCKET_IFNAME="${SOCKET_IFNAME}"
        export TP_SOCKET_IFNAME="${SOCKET_IFNAME}"
        export HCCL_SOCKET_IFNAME="${SOCKET_IFNAME}"
        export HCCL_INTRA_ROCE_ENABLE=1
        export HCCL_INTRA_PCIE_ENABLE=0
        ENCODE_MODEL_PATH={{ model_path | quote }}
        if [ -f "${ENCODE_MODEL_PATH}/preprocessor_config.json" ]; then
          MEDIA_IO_KWARGS=$(python -c "import json,sys; data=json.load(open(sys.argv[1])); print(json.dumps({
                'image': {'rgba_background_color': [128,128,128]},
                'video': {
                    'num_frames': data.get('num_frames',32),
                    'sample_fps': data.get('sample_fps',1)
                }
            },separators=(',',':')))" "${ENCODE_MODEL_PATH}/preprocessor_config.json")
        else
          MEDIA_IO_KWARGS='{"image":{"rgba_background_color":[128,128,128]},"video":{"num_frames":32,"sample_fps":1}}'
        fi
        MM_PROCESSOR_KWARGS='{"image_use_fast":true}'

      # 地址、端口、TP/DP、EC/MM 配置由模板补充；encoder-only 开关在下方 args 中设置。
      args:
        - --served-model-name pangu_ultra_moe
        - --max-model-len 16384
        - --allowed-local-media-path /
        - --media-io-kwargs "${MEDIA_IO_KWARGS}"
        - --dtype bfloat16
        - --max-num-batched-tokens 16384
        - --max-num-seqs 8
        - --no-enable-chunked-prefill
        - --no-enable-prefix-caching
        - --mm-processor-kwargs "${MM_PROCESSOR_KWARGS}"
        - --mm-processor-cache-gb 8
        - --mm-processor-cache-type shm
        - --mm-shm-cache-max-object-size-mb 256
        - --distributed-executor-backend mp
        - --gpu-memory-utilization 0.01
        - --trust-remote-code
        - --async-scheduling
        - --mm-encoder-only
        - --enable-expert-parallel
        - --enable-log-requests
        - --enable-log-outputs
        - --enforce-eager
        - --hf-overrides "{\"model_architectures\":\"OpenPanguV2ForCausalLM\",\"text_config\":{\"model_architectures\":\"OpenPanguV2ForCausalLM\"}}"

    run_server_prefill_profile:
      docker_envs:
        VLLM_PLUGINS: "omni-npu,omni_pangu_models,omni_npu_patches,omni_custom_models"
        OMNI_VLLM_PATCHES_DIR: "pangu_v2_hybrid,pangu_v2_moe,openpangu_v1_vl"
        OMNI_VLLM_PATCHES: "ALL"
        OMNI_HYBRID_ATTN_GROUP_SIZE: "17"
        VLLM_VIDEO_LOADER_BACKEND: npu_opencv_dynamic

        ASCEND_GLOBAL_LOG_LEVEL: "3"
        TASK_QUEUE_ENABLE: "2"
        USING_SAMPLING_TENSOR_CACHE: "1"
        USING_LCCL_COM: "1"
        CPU_AFFINITY_CONF: "1"
        VLLM_WORKER_MULTIPROC_METHOD: "spawn"
        OMP_NUM_THREADS: "64"

        TORCH_COMPILE_DISABLE: "1"
        VLLM_DISABLE_PYNCCL: "1"
        HCCL_CONNECT_TIMEOUT: "1800"
        HCCL_EXEC_TIMEOUT: "1800"
        HCCL_OP_RETRY_ENABLE: "L0:0,L1:0,L2:0"
        HCCL_OP_EXPANSION_MODE: "AIV"
        HCCL_BUFFSIZE: "500"

        OMNI_REUSE_PREFILLED_TOKENS: "1"
        OMNI_SKIP_DECODE_TOKENIZE: "1"
        VLLM_OBJECT_STORAGE_SHM_BUFFER_NAME: "PREFILL_SHM_BUFFER"
        VLLM_MQ_MAX_CHUNK_BYTES_MB: "100"
        PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"

      # epd_topology_config.prefill 由 role 根据 inventory 生成，以下字段都是传输配置字典：
      # ec_config：EC 连接器、consumer 角色和缓存选项；Network 模式另含 E 的地址/端口。
      #   对应 --ec-transfer-config，用于 E -> P 传输按媒体 hash 索引的 Encoder 输出 embedding。
      # mm_config：MM 连接器、落盘目录及网络收发地址，对应 --mm-feature-transfer-config。
      #   复用多模态预处理数据（mm_item）和 prompt_updates；SharedMem 下 P 读 E 的本地数据，
      #   Network 下 P 接收 E 的数据并落盘。这与 EC 的 Encoder 输出缓存是两条独立链路。
      prepare_commands: |-
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_ALL | replace(' ', '') | trim | quote }}

        source /usr/local/Ascend/ascend-toolkit/set_env.sh
        # source /usr/local/Ascend/ascend-toolkit/vendors/omni_custom_ops/bin/set_env.bash
        # source /usr/local/Ascend/ascend-toolkit/vendors/omni_training_custom_ops/bin/set_env.bash

        ENDPOINT_PORT=$((${API_PORT} + 100))
        export KV_EVENTS_CONFIG='{"enable_kv_cache_events":true,"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:'${ENDPOINT_PORT}'"}'

        if [ -f "{{ model_path }}/preprocessor_config.json" ]; then
          MEDIA_IO_KWARGS=$(python -c "import json; data=json.load(open('{{ model_path }}/preprocessor_config.json')); print(json.dumps({
              'image': {'rgba_background_color': [128,128,128]},
              'video': {
                  'num_frames': data.get('num_frames',32),
                  'sample_fps': data.get('sample_fps',1)
              }
          },separators=(',',':')))")
        else
          MEDIA_IO_KWARGS='{"image":{"rgba_background_color":[128,128,128]},"video":{"num_frames":32,"sample_fps":1}}'
        fi
        MM_PROCESSOR_KWARGS='{"image_use_fast":true}'

        EXTRA_ARGS='--no-disable-hybrid-kv-cache-manager'
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-batched-tokens 16384 --enable-expert-parallel"
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-seqs 16 --no-enable-prefix-caching"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-chunked-prefill --dtype bfloat16 --enforce-eager"
        EXTRA_ARGS="${EXTRA_ARGS}"' --hf-overrides {"model_architectures":"OpenPanguV2ForCausalLM","text_config":{"model_architectures":"OpenPanguV2ForCausalLM"}}'
        EXTRA_ARGS="${EXTRA_ARGS} --allowed-local-media-path /"
        EXTRA_ARGS="${EXTRA_ARGS} --media-io-kwargs ${MEDIA_IO_KWARGS}"
        EXTRA_ARGS="${EXTRA_ARGS} --mm-processor-kwargs ${MM_PROCESSOR_KWARGS}"
        EXTRA_ARGS="${EXTRA_ARGS} --mm-processor-cache-type shm --mm-processor-cache-gb 8"
        EXTRA_ARGS="${EXTRA_ARGS} --mm-shm-cache-max-object-size-mb 256"
        {% set config = epd_topology_config.prefill %}
        {% if config.get('ec_config') %}
        EXTRA_ARGS="${EXTRA_ARGS} --ec-transfer-config "{{ config.ec_config | to_json(separators=(',', ':')) | quote }}
        {% endif %}
        EXTRA_ARGS="${EXTRA_ARGS} --mm-feature-transfer-config "{{ config.mm_config | to_json(separators=(',', ':')) | quote }}

      args:
        - --max-model-len 262144
        - --served-model-name pangu_ultra_moe
        - >-
          --additional-config '{"enable_low_latency": true, "npugraph_ex_config": {"enable": true, "super_kernel_optimize": false, "static_kernel_compile": true}}'
        - --gpu-util 0.8
        - --hccl-buffsize 500
        - --hccl-op-expansion-mode AIV
        - --num-speculative-tokens 3
        - --extra-args "${EXTRA_ARGS}"

    # epd_topology_config.decode.mm_config 为 D 的 MM 网络接收及落盘配置；D 不加载 EC 缓存。
    run_server_decode_profile:
      docker_envs:
        VLLM_PLUGINS: "omni-npu,omni_pangu_models,omni_npu_patches,omni_custom_models"
        OMNI_VLLM_PATCHES_DIR: "pangu_v2_hybrid,pangu_v2_moe,openpangu_v1_vl"
        OMNI_VLLM_PATCHES: "ALL"
        OMNI_HYBRID_ATTN_GROUP_SIZE: "17"
        ENABLE_DP_LB: "false"
        VLLM_DATA_PARALLEL_EXTERNAL_LB: "false"
        VLLM_VIDEO_LOADER_BACKEND: npu_opencv_dynamic

        ASCEND_GLOBAL_LOG_LEVEL: "3"
        TASK_QUEUE_ENABLE: "1"
        USING_SAMPLING_TENSOR_CACHE: "1"
        USING_LCCL_COM: "1"
        CPU_AFFINITY_CONF: "1"
        VLLM_WORKER_MULTIPROC_METHOD: "spawn"
        OMP_NUM_THREADS: "64"
        LOCAL_WORLD_SIZE: "{{ ascend_rt_visible_devices.split(',') | length }}"

        VLLM_DISABLE_PYNCCL: "1"
        VLLM_DISABLE_COMPILE_CACHE: "1"
        HCCL_CONNECT_TIMEOUT: "1800"
        HCCL_EXEC_TIMEOUT: "1800"
        HCCL_OP_RETRY_ENABLE: "L0:0,L1:0,L2:0"
        HCCL_OP_EXPANSION_MODE: "AI_CPU"
        HCCL_BUFFSIZE: "1000"

        OMNI_REUSE_PREFILLED_TOKENS: "1"
        OMNI_SKIP_DECODE_TOKENIZE: "1"
        VLLM_OBJECT_STORAGE_SHM_BUFFER_NAME: "DECODE_SHM_BUFFER"
        VLLM_MQ_MAX_CHUNK_BYTES_MB: "100"
        PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
        VLLM_CACHE_ROOT: "{{ container_workspace }}/omniinfer/tools/deploy/start_server/graph_cache"


      prepare_commands: |-
        export DECODE_DATA_PARALLEL_SIZE={{ DECODE_SERVER_BY_GROUP | quote }}
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_BY_GROUP | replace(' ', '') | trim | quote }}

        source /usr/local/Ascend/ascend-toolkit/set_env.sh
        # source /usr/local/Ascend/ascend-toolkit/vendors/omni_custom_ops/bin/set_env.bash
        # source /usr/local/Ascend/ascend-toolkit/vendors/omni_training_custom_ops/bin/set_env.bash

        if [ -f "{{ model_path }}/preprocessor_config.json" ]; then
          MEDIA_IO_KWARGS=$(python -c "import json; data=json.load(open('{{ model_path }}/preprocessor_config.json')); print(json.dumps({
              'image': {'rgba_background_color': [128,128,128]},
              'video': {
                  'num_frames': data.get('num_frames',32),
                  'sample_fps': data.get('sample_fps',1)
              }
          },separators=(',',':')))")
        else
          MEDIA_IO_KWARGS='{"image":{"rgba_background_color":[128,128,128]},"video":{"num_frames":32,"sample_fps":1}}'
        fi
        MM_PROCESSOR_KWARGS='{"image_use_fast":true}'

        EXTRA_ARGS='--no-disable-hybrid-kv-cache-manager --enable-expert-parallel'
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-seqs 24 --enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-batched-tokens 96"
        EXTRA_ARGS="${EXTRA_ARGS} --no-enable-prefix-caching --distributed-executor-backend mp"
        EXTRA_ARGS="${EXTRA_ARGS} --dtype bfloat16"
        EXTRA_ARGS="${EXTRA_ARGS}"' --hf-overrides {"model_architectures":"OpenPanguV2ForCausalLM","text_config":{"model_architectures":"OpenPanguV2ForCausalLM"}}'
        EXTRA_ARGS="${EXTRA_ARGS}"' --compilation-config {"mode":3,"cudagraph_mode":"FULL","cudagraph_capture_sizes":[4,96],"backend":"","compile_sizes":[4,96]}'
        EXTRA_ARGS="${EXTRA_ARGS} --allowed-local-media-path /"
        EXTRA_ARGS="${EXTRA_ARGS} --media-io-kwargs ${MEDIA_IO_KWARGS}"
        EXTRA_ARGS="${EXTRA_ARGS} --mm-processor-kwargs ${MM_PROCESSOR_KWARGS}"
        EXTRA_ARGS="${EXTRA_ARGS} --mm-processor-cache-gb 8"
        EXTRA_ARGS="${EXTRA_ARGS} --mm-feature-transfer-config "{{ epd_topology_config.decode.mm_config | to_json(separators=(',', ':')) | quote }}

        # Current runner workdir is tools/deploy/start_server, not tools/scripts.
        rm -rf "{{ container_workspace }}/omniinfer/tools/deploy/start_server/static_kernel_compile_outputs"
        rm -rf /usr/local/Ascend/cann/opp/static_kernel
        rm -rf /usr/local/Ascend/cann-9.1.0-beta.1/opp/static_kernel
        rm -rf "{{ container_workspace }}/omniinfer/tools/deploy/start_server/graph_cache"

      args:
        - --max-model-len 262144
        - --served-model-name pangu_ultra_moe
        - --tp 1
        - >-
          --additional-config '{"enable_low_latency": true, "npugraph_ex_config": {"enable": true, "super_kernel_optimize": false, "static_kernel_compile": true}}'
        - --gpu-util 0.85
        - --hccl-buffsize 1000
        - --hccl-op-expansion-mode AI_CPU
        - --num-speculative-tokens 3
        - --extra-args "${EXTRA_ARGS}"

    run_server_common_profile:
      kv_connector: LLMDataDistConnector
      single_node_prefill_wait_seconds: 5
      restart_proxy: true

    # encode_endpoints 为 E 的 HTTP 地址列表；SharedMem 按 P 顺序配对 E/P，Network 使用 sequential。
    run_proxy_profile:
      prepare_commands: |-
        export PYTHONHASHSEED=1234
        export TORCH_DEVICE_BACKEND_AUTOLOAD=0

        encode_endpoints={{ epd_topology_config.encode_endpoints | join(',') | quote }}
        proxy_args=()
        {% if epd_profile.enabled %}
        proxy_args+=(--encode-endpoints "$encode_endpoints")
        {% endif %}
        {% if epd_profile.enabled and epd_profile.connector_type == 'SharedMemConnector' %}
        epd_proxy_groups={{ range(epd_topology_config.encode_endpoints | length) | map('string') | map('regex_replace', '$', ':1') | join(',') | quote }}
        proxy_args+=(
          --omni-proxy-encode-ep-groups "$epd_proxy_groups"
          --omni-proxy-prefill-ep-groups "$epd_proxy_groups"
          --omni-proxy-pd-policy epd_e_p_node_share
        )
        {% else %}
        proxy_args+=(--omni-proxy-pd-policy sequential)
        {% endif %}
      args:
        - --log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_error.log
        - --log-level notice
        - --access-log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_access.log
        - --core-num 4
        - --start-core-index 16
        - --client-max-body-size 1000M
        - --client-body-buffer-size 50M
        - --subrequest-output-buffer-size 10M
        - --omni-proxy-max-batch-num-token 100000
        - --omni-proxy-prefill-max-num-seqs 16
        - --omni-proxy-decode-max-num-seqs 24
        - '"${proxy_args[@]}"'

  tasks:
    - ansible.builtin.import_role:
        name: epd_server
