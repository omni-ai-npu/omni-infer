---
- name: Run Pangu 92B Prefill, Decode, and Omni Proxy services.
  hosts: all
  any_errors_fatal: true
  max_fail_percentage: 0
  gather_facts: true
  environment:
    LOG_PATH: /data/log_path
    LOG_PATH_IN_EXECUTOR: /data/log_path_in_executor
    CODE_PATH: /data/local_code_path
    DOCKER_IMAGE_ID: "registry-cbu.huawei.com/omniai_omniinfer/ai-infra-infer-1.1.1-arm-openeuler-py311-a3-cann.9.1.t2.b020-pta_v2.9.0-op-1.2.1.post1-omni_dev_v1.0.0-vllm-202607090010:0.0.1"
    DOCKER_NAME_P: "docker_name_p"
    DOCKER_NAME_D: "docker_name_d"
    DOCKER_NAME_C: "docker_name_c"
    SCRIPTS_PATH: /tmp/scripts_path

  vars:
    model: pangu-v2-92b
    model_path: "/mnt/sfs_turbo/bucket-910c-6055/zhuqi/ckpt/pangu92b/0620_v21_new/output_ckpts/hf/global_step_26-iterative-int8-0626"

    run_docker_profile:
      envs:
        - PYTHONHASHSEED=1234
      extra_mounts:
        - /mnt:/mnt
        - /tmp:/tmp
        - /home:/home

    sync_code_profile:
      container_copy:
        prefill: >-
          docker exec $DOCKER_NAME_P rm -rf
          {{ container_workspace }}/omniinfer/components/omni-npu
          {{ container_workspace }}/omniinfer/tools &&
          docker exec $DOCKER_NAME_P mkdir -p
          {{ container_workspace }}/omniinfer/components &&
          docker cp {{ ansible_env.CODE_PATH }}/omniinfer/omni
          $DOCKER_NAME_P:{{ container_workspace }}/omniinfer/components/omni-npu &&
          docker cp {{ ansible_env.CODE_PATH }}/omniinfer/tools
          $DOCKER_NAME_P:{{ container_workspace }}/omniinfer/
        decode: >-
          docker exec $DOCKER_NAME_D rm -rf
          {{ container_workspace }}/omniinfer/components/omni-npu
          {{ container_workspace }}/omniinfer/tools &&
          docker exec $DOCKER_NAME_D mkdir -p
          {{ container_workspace }}/omniinfer/components &&
          docker cp {{ ansible_env.CODE_PATH }}/omniinfer/omni
          $DOCKER_NAME_D:{{ container_workspace }}/omniinfer/components/omni-npu &&
          docker cp {{ ansible_env.CODE_PATH }}/omniinfer/tools
          $DOCKER_NAME_D:{{ container_workspace }}/omniinfer/
        proxy: >-
          docker exec $DOCKER_NAME_C rm -rf
          {{ container_workspace }}/omniinfer/components/omni-npu
          {{ container_workspace }}/omniinfer/tools &&
          docker exec $DOCKER_NAME_C mkdir -p
          {{ container_workspace }}/omniinfer/components &&
          docker cp {{ ansible_env.CODE_PATH }}/omniinfer/omni
          $DOCKER_NAME_C:{{ container_workspace }}/omniinfer/components/omni-npu &&
          docker cp {{ ansible_env.CODE_PATH }}/omniinfer/tools
          $DOCKER_NAME_C:{{ container_workspace }}/omniinfer/

    run_server_prefill_profile:
      prepare_commands: |-
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_ALL | replace(' ', '') | trim | quote }}
        export HCCL_SOCKET_IFNAME="${SOCKET_IFNAME}"
        export VLLM_DISABLE_COMPILE_CACHE=1
        export VLLM_CACHE_ROOT='./graph_cache'
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_p_omnicache_claw.json"
        export ASCEND_LAUNCH_BLOCKING=1
        export PYTHONHASHSEED=42
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export VLLM_DISABLE_PYNCCL=1
        export ENABLE_RANK_PRINT=1
        export USE_MOE_FORCE_LOAD_BALANCE=0
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
      args:
        - --max-model-len 131072
        - --served-model-name pangu_ultra_moe
        - '--additional-config ''{"enable_low_latency": true}'''
        - --gpu-util 0.95
        - >-
          --extra-args '--dtype bfloat16
          --max-num-batched-tokens 49152 --max-num-seqs 1
          --no-disable-hybrid-kv-cache-manager --enable-chunked-prefill
          --no-enable-prefix-caching --distributed-executor-backend mp
          --enable-expert-parallel --enforce-eager'
        - --hccl-buffsize 500
        - --hccl-op-expansion-mode AIV
        - --num-speculative-tokens 0

    run_server_decode_profile:
      prepare_commands: |-
        export DECODE_DATA_PARALLEL_SIZE={{ DECODE_SERVER_BY_GROUP | quote }}
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_BY_GROUP | replace(' ', '') | trim | quote }}
        export HCCL_SOCKET_IFNAME="${SOCKET_IFNAME}"
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_EXEC_TIMEOUT=1800
        export VLLM_DISABLE_COMPILE_CACHE=1
        export VLLM_CACHE_ROOT='/data/z00938669/workspace/tests/temp/graph_cache_decode'
        export VLLM_WORKER_MULTIPROC_METHOD=fork
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        export TASK_QUEUE_ENABLE=1
        export VLLM_DISABLE_PYNCCL=1
        export ASCEND_LAUNCH_BLOCKING=1
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export ENABLE_RANK_PRINT=1
        export USE_MOE_FORCE_LOAD_BALANCE=0
        export PYTHONHASHSEED=42
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_d_omnicache_claw.json"
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
      args:
        - --max-model-len 131072
        - --tp 1
        - --served-model-name pangu_ultra_moe
        - '--additional-config ''{"enable_low_latency": true}'''
        - --gpu-util 0.85
        - >-
          --extra-args '--dtype bfloat16
          --max-num-batched-tokens 8192 --max-num-seqs 4
          --no-disable-hybrid-kv-cache-manager --enable-chunked-prefill
          --no-enable-prefix-caching --distributed-executor-backend mp
          --enable-expert-parallel --enforce-eager'
        - --hccl-buffsize 500
        - --hccl-op-expansion-mode AIV
        - --num-speculative-tokens 0

    run_server_common_profile:
      single_node_prefill_wait_seconds: 0
      restart_proxy: true

    run_proxy_profile:
      type: omni-proxy
      prepare_commands: |-
        export PYTHONHASHSEED=1234
        export TORCH_DEVICE_BACKEND_AUTOLOAD=0
      omni-proxy:
        args:
          - --log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_error.log
          - --log-level info
          - --access-log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_access.log
          - --core-num 4
          - --start-core-index 16
          - --subrequest-output-buffer-size 10M
          - --omni-proxy-pd-policy sequential
          - --omni-proxy-max-batch-num-token 100000
          - --omni-proxy-prefill-max-num-seqs 1
          - --omni-proxy-decode-max-num-seqs 4

  tasks:
    - ansible.builtin.import_role:
        name: elastic_server
