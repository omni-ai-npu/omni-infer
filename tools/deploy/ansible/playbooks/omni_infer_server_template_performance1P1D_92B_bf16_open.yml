---
- name: Run high-layer PanguV2 92B Prefill, Decode, and Omni Proxy services.
  hosts: all
  any_errors_fatal: true
  max_fail_percentage: 0
  gather_facts: true
  environment:
    LOG_PATH: /data/log_path
    LOG_PATH_IN_EXECUTOR: /data/log_path_in_executor
    CODE_PATH: /data/local_code_path
    DOCKER_IMAGE_ID: "registry-cbu.huawei.com/omniai_omniinfer_dev/ai-infra-infer-1.0.3-a3-arm-feature/vllm_0.25.1-202608140942-daily:0.0.2"
    DOCKER_NAME_P: "docker_name_p"
    DOCKER_NAME_D: "docker_name_d"
    DOCKER_NAME_C: "docker_name_c"
    SCRIPTS_PATH: /tmp/scripts_path

  vars:
    model: pangu-v2-92b
    model_path: "/mnt/sfs_turbo/bucket-910c-6055/zhuqi/ckpt/pangu92b/0620_v21_new/output_ckpts/hf/global_step_26/"

    run_docker_profile:
      envs:
        - PYTHONHASHSEED=1234
      extra_mounts:
        - /mnt:/mnt
        - /tmp:/tmp
        - /home:/home
        - /efs_guiyang:/efs_guiyang

    sync_code_profile:
      container_copy:
        prefill: >-
          docker exec "$DOCKER_NAME_P" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_P" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_P}:{{ container_workspace }}/omniinfer/"
        decode: >-
          docker exec "$DOCKER_NAME_D" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_D" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_D}:{{ container_workspace }}/omniinfer/"

    run_server_prefill_profile:
      prepare_commands: |-
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_ALL | replace(' ', '') | trim | quote }}
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=100
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_EXEC_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AIV"
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export TASK_QUEUE_ENABLE=2
        export OMNI_REUSE_PREFILLED_TOKENS=1
        export OMNI_SKIP_DECODE_TOKENIZE=1
        export VLLM_MQ_MAX_CHUNK_BYTES_MB=100
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=17
        export OMNI_VLLM_PATCHES_DIR="pangu_v2_hybrid, pangu_v2_moe"
        export OMNI_VLLM_PATCHES="ALL"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_92B_xp1d_p_open.json"
        export OMNI_PANGU_TOOL_CALL_ENDS_THINKING=1
        export TORCH_COMPILE_DISABLE=1
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        EXTRA_ARGS="--no-disable-hybrid-kv-cache-manager"
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-batched-tokens 16384"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-expert-parallel --max-num-seqs 4"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prefix-caching --enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --dtype bfloat16 --enforce-eager"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-auto-tool-choice --tool-call-parser pangu"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-lopt --lopt-pool-size 16"
        EXTRA_ARGS="${EXTRA_ARGS} --lopt-chunk-size 4096"
        REASONING_CONFIG='{"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-config ${REASONING_CONFIG}"
      args:
        - --max-model-len 524288
        - '--additional-config ''{"enable_low_latency": true}'''
        - --gpu-util 0.8
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 3

    run_server_decode_profile:
      prepare_commands: |-
        export DECODE_DATA_PARALLEL_SIZE={{ DECODE_SERVER_BY_GROUP | quote }}
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_BY_GROUP | replace(' ', '') | trim | quote }}
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=1200
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_EXEC_TIMEOUT=1800
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export HCCL_OP_EXPANSION_MODE="AI_CPU"
        export OMNI_REUSE_PREFILLED_TOKENS=1
        export OMNI_SKIP_DECODE_TOKENIZE=1
        export VLLM_MQ_MAX_CHUNK_BYTES_MB=100
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=17
        export OMNI_VLLM_PATCHES_DIR="pangu_v2_hybrid, pangu_v2_moe"
        export OMNI_VLLM_PATCHES="ALL"
        export ENABLE_DP_LB=false
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_92B_xp1d_d_open.json"
        export OMNI_PANGU_TOOL_CALL_ENDS_THINKING=1
        export TORCH_COMPILE_DISABLE=1
        export VLLM_CACHE_ROOT='./graph_cache'
        export TASK_QUEUE_ENABLE=1
        export LOCAL_WORLD_SIZE=16
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        rm -rf {{ container_workspace }}/omniinfer/tools/deploy/start_server/static_kernel_compile_outputs
        rm -rf /usr/local/Ascend/cann/opp/static_kernel
        rm -rf /usr/local/Ascend/cann-9.1.0-beta.1/opp/static_kernel
        rm -rf graph_cache/
        EXTRA_ARGS="--no-disable-hybrid-kv-cache-manager --enable-expert-parallel"
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-seqs 3"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prefix-caching --enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --distributed-executor-backend mp"
        EXTRA_ARGS="${EXTRA_ARGS} --dtype bfloat16"
        COMPILATION_CONFIG='{"mode": 3, "cudagraph_mode":"FULL", "cudagraph_capture_sizes":[12], "backend":"", "compile_sizes":[12]}'
        EXTRA_ARGS="${EXTRA_ARGS} --compilation-config ${COMPILATION_CONFIG}"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-auto-tool-choice --tool-call-parser pangu"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-lopt --lopt-pool-size 16"
        EXTRA_ARGS="${EXTRA_ARGS} --lopt-chunk-size 4096"
        REASONING_CONFIG='{"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-config ${REASONING_CONFIG}"
      args:
        - --max-model-len 524288
        - --tp 1
        - >-
          --additional-config
          '{"enable_low_latency": true,
          "npugraph_ex_config":{"enable": true,
          "super_kernel_optimize": false,
          "static_kernel_compile": false}}'
        - --gpu-util 0.82
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 3

    run_server_common_profile:
      restart_proxy: true

    run_proxy_profile:
      prepare_commands: |-
        export PYTHONHASHSEED=1234
        export TORCH_DEVICE_BACKEND_AUTOLOAD=0
      args:
        - --log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_error.log
        - --log-level info
        - --access-log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_access.log
        - --core-num 4
        - --start-core-index 16
        - --subrequest-output-buffer-size 10M
        - --omni-proxy-pd-policy sequential
        - --omni-proxy-max-batch-num-token 100000
        - --omni-proxy-prefill-max-num-seqs 4
        - --omni-proxy-decode-max-num-seqs 3

    proc_bind_profile:
      enabled: "{{ proc_bind_enabled | default(false) | bool }}"

  tasks:
    - ansible.builtin.import_role:
        name: elastic_server
