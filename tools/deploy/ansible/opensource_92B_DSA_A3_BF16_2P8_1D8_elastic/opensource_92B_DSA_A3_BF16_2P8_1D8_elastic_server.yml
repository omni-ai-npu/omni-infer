# 动态扩缩容相关配置：
# 1. P/D侧 --additional-config '{"enable_pd_elastic_scaling": true}'
# 2. import_role: name: elastic_server
# 使用
# 扩容：1P1D 起 → --tags add_node（inventory 换成 2p1d 那份）→ reload_proxy
# 缩容：2P1D 起 → --tags delete_node -e delete_node_profile.ips=[p1的IP]
---
- name: xPyD elastic scaling - Pangu2-R-92B BF16 2P8-1D8
  hosts: all
  any_errors_fatal: true
  max_fail_percentage: 0
  gather_facts: true

  environment:
    LOG_PATH: "/data/log_path"
    LOG_PATH_IN_EXECUTOR: "/data/log_path_in_executor"
    CODE_PATH: "/data/local_code_path"
    SCRIPTS_PATH: "/tmp/scripts_path"
    DOCKER_IMAGE_ID: "registry-cbu.huawei.com/omniai_omniinfer_dev/ai-infra-infer-1.0.3-a3-arm-develop-202609050943-daily:0.0.1"
    DOCKER_NAME_P: "elastic_server_p"
    DOCKER_NAME_D: "elastic_server_d"
    DOCKER_NAME_C: "elastic_server_c"
    DOCKER_NAME_M: "elastic_server_m"

  vars:
    model: pangu2-r-92b-xpyd-bf16
    model_path: "/mnt/sfs_turbo/bucket-910c-6055/s00562949/models/openPangu_2.0_Flash_BF16/global_step_26/"

    run_docker_profile:
      shm_size: 500g
      envs:
        - PYTHONHASHSEED=1234
      extra_mounts:
        - /mnt:/mnt
        - /tmp:/tmp
        - /home:/home

    sync_code_profile:
      container_copy:
        prefill: >-
          docker exec "$DOCKER_NAME_P" mkdir -p '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_P" find '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.' "${DOCKER_NAME_P}:{{ container_workspace }}/omniinfer/"
        decode: >-
          docker exec "$DOCKER_NAME_D" mkdir -p '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_D" find '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.' "${DOCKER_NAME_D}:{{ container_workspace }}/omniinfer/"

    run_server_prefill_profile:
      prepare_commands: |-
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_ALL | replace(' ', '') | trim | quote }}
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=1000
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_EXEC_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AIV"
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export TASK_QUEUE_ENABLE=2
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=17
        export OMNI_VLLM_PATCHES_DIR="pangu_v2_hybrid, pangu_v2_moe"
        export OMNI_VLLM_PATCHES="ALL"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_xp1d_p.json"
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        EXTRA_ARGS="--no-disable-hybrid-kv-cache-manager"
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-batched-tokens 16384"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-expert-parallel --max-num-seqs 24"
        EXTRA_ARGS="${EXTRA_ARGS} --no-enable-prefix-caching --no-enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --dtype bfloat16 --enforce-eager"
        EXTRA_ARGS="${EXTRA_ARGS} --distributed-executor-backend mp"
      args:
        - --max-model-len 16384
        - --served-model-name pangu_ultra_moe
        - '--additional-config ''{"enable_low_latency": true, "enable_pd_elastic_scaling": true}'''
        - --gpu-util 0.88
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 3

    run_server_decode_profile:
      prepare_commands: |-
        export DECODE_DATA_PARALLEL_SIZE={{ DECODE_SERVER_BY_GROUP | quote }}
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_BY_GROUP | replace(' ', '') | trim | quote }}
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=1000
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_EXEC_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AIV"
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export TASK_QUEUE_ENABLE=1
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=17
        export OMNI_VLLM_PATCHES_DIR="pangu_v2_hybrid, pangu_v2_moe"
        export OMNI_VLLM_PATCHES="ALL"
        export ENABLE_DP_LB=false
        export VLLM_DATA_PARALLEL_EXTERNAL_LB=false
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_xp1d_d.json"
        export TORCH_COMPILE_DISABLE=1
        export VLLM_CACHE_ROOT='./graph_cache'
        export VLLM_TORCH_PROFILER_WITH_PROFILE_MEMORY=False
        export VLLM_TORCH_PROFILER_WITH_STACK=False
        export VLLM_TORCH_PROFILER_WITH_FLOPS=False
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        rm -rf graph_cache/
        python3 -c "from transformers import AutoConfig; AutoConfig.from_pretrained('{{ model_path }}', trust_remote_code=True)"
        EXTRA_ARGS="--no-disable-hybrid-kv-cache-manager --enable-expert-parallel"
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-seqs 24"
        EXTRA_ARGS="${EXTRA_ARGS} --no-enable-prefix-caching --no-enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --distributed-executor-backend mp"
        EXTRA_ARGS="${EXTRA_ARGS} --dtype bfloat16"
        COMPILATION_CONFIG='{"mode": 3, "cudagraph_mode":"FULL_DECODE_ONLY", "cudagraph_capture_sizes":[96], "backend":"", "compile_sizes":[96]}'
        EXTRA_ARGS="${EXTRA_ARGS} --compilation-config ${COMPILATION_CONFIG}"
      args:
        - --max-model-len 16384
        - --tp 1
        - --served-model-name pangu_ultra_moe
        - '--additional-config ''{"enable_low_latency": true, "enable_pd_elastic_scaling": true}'''
        - --gpu-util 0.9
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 3

    run_server_common_profile:
      kv_connector: LLMDataDistConnector
      restart_proxy: true

    run_proxy_profile:
      prepare_commands: |-
        export PYTHONHASHSEED=1234
        export TORCH_DEVICE_BACKEND_AUTOLOAD=0
      args:
        - --log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_error.log
        - --log-level info
        - --access-log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_access.log
        - --core-num 4
        - --start-core-index 16
        - --subrequest-output-buffer-size 10M
        - --omni-proxy-pd-policy sequential
        - --omni-proxy-model-path {{ model_path | quote }}
        - --omni-proxy-max-batch-num-token 100000
        - --omni-proxy-prefill-max-num-seqs 8
        - --omni-proxy-decode-max-num-seqs 8

    proc_bind_profile:
      enabled: false

  tasks:
    - ansible.builtin.import_role:
        name: elastic_server
